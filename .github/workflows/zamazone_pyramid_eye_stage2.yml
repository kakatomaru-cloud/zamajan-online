name: Replace Stage 2 boss with playable Pyramid Eye
on:
  push:
    branches: [chatgpt-staging]
    paths:
      - 'scripts/apply_zamazone_pyramid_eye_stage2.py'
      - 'scripts/zamazone_pyramid_eye_stage2_v1.js'
      - 'scripts/apply_zamazone_desert_redesign.py'
      - 'scripts/apply_zamazone_board_stage1356.py'
      - 'scripts/zamazone_mana4_stage3_live.js'
      - 'scripts/apply_zamazone_mana4_stage3.py'
      - 'zamajan-online/public/minigames/zamazone/board_stage1356.js'
      - 'zamajan-online/public/minigames/zamazone/assets/board_stage1356/**'
      - 'zamajan-online/public/minigames/zamazone/desert_redesign_stage2.js'
      - 'zamajan-online/public/minigames/zamazone/assets/desert_redesign/**'
      - '.github/workflows/zamazone_pyramid_eye_stage2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-staging
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate sprite assets and replace Stage 2 boss
        run: python3 scripts/apply_zamazone_pyramid_eye_stage2.py
      - name: Integrate approved ground/air desert bases and enemies
        run: python3 scripts/apply_zamazone_desert_redesign.py
      - name: Integrate source-approved board art for stages 1,3,4,5,6
        run: python3 scripts/apply_zamazone_board_stage1356.py
      - name: Integrate playable mana4 boss on stage 3
        run: python3 scripts/apply_zamazone_mana4_stage3.py
      - name: Verify artwork, integration, and JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('zamajan-online/public/minigames/zamazone')
          s=(p/'index.html').read_text(encoding='utf8')
          assert s.count('// ZAMAZONE_PYRAMID_EYE_STAGE2_V1_20261116')==1
          assert 'pyramidOn()' in s and 'defeatBoss()' in s
          assert s.count('ZAMAZONE_BOARD_STAGE1356_V1_20261118')==1
          assert s.count('ZAMAZONE_MANA4_STAGE3_LIVE_V1_20261119')==1
          for name in ('grass','ocean','snow','neon','digital'):
              assert (p/'assets/board_stage1356'/f'{name}.png').stat().st_size>2000
          assert (p/'assets/board_stage1356/grass_hq.webp').stat().st_size>30000
          assert 'ZAMAZONE_STAGE1_SOURCE_ART_HQ_V4_20261118' in s
          for i in range(16):assert (p/'assets/pyramid_eye'/('body_%02d.webp'%i)).stat().st_size>2000
          for i in range(8):assert (p/'assets/pyramid_eye'/('orb_%02d.webp'%i)).stat().st_size>2000
          assert (p/'assets/pyramid_eye/rock.webp').stat().st_size>2000
          for i,code in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)):
              if code.strip():Path('/tmp/pyramid-game-%d.js'%i).write_text(code,encoding='utf8')
          PY
          for f in /tmp/pyramid-game-*.js; do node --check "$f"; done
      - name: Check legacy defeat renderer references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('zamajan-online/public/minigames/zamazone/index.html').read_text('utf8')
          # Scan only original content before our injected Pyramid Eye script.
          s=s.split('// ZAMAZONE_PYRAMID_EYE_STAGE2_V1_20261116')[0]
          for needle in ['function defeatBoss','bossDeath','function drawBoss','function draw(']:
            results=list(re.finditer(re.escape(needle),s))
            print('LEGACY_DEATH_COUNT',needle,len(results))
            for m in results[:9]:
              print('LEGACY_DEATH_CONTEXT',needle,repr(s[max(0,m.start()-180):m.start()+600]))
          PY
      - name: Inspect hit and damage hooks for shared feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('zamajan-online/public/minigames/zamazone/index.html').read_text('utf8')
          s=s.split('// ZAMAZONE_PYRAMID_EYE_STAGE2_V1_20261116')[0]
          for target in ['function hitBase(', 'function updatePlay(', 'function updatePlayer(', 'function update(dt)', 'function drawBase(', 'function drawEnemy(', 'function drawBoss(', 'function explode(']:
            at=s.find(target)
            if at>=0:print('SHARED_HIT_SOURCE',target,repr(s[at:at+3100]))
          for name in ['applyRigShot','applyRigBomb','damageEnemy','damageBase','hitEnemy','hitBase','drawEnemy','drawBase','drawBoss','function sound','function updateShots','function drawProjectiles','function updateProjectiles','function updateBullets','function drawRig','function updateRig','function updateEnemies','function updateBases']:
            matches=list(re.finditer(re.escape(name),s))
            print('HIT_HOOK',name,'COUNT',len(matches))
            for m in matches[-3:]:
              print('HIT_HOOK_DETAIL',name,repr(s[max(0,m.start()-80):m.start()+1900]))
          PY
      - name: Examine boss debug selector, shop, game-over hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('zamajan-online/public/minigames/zamazone/index.html').read_text('utf8')
          s=s.split('// ZAMAZONE_PYRAMID_EYE_STAGE2_V1_20261116')[0]
          for needle in ["zb-debug-open","data-dbg-boss","function v2Buy(","v2Buy=function","function v2Allowed(","function v2Cost(","function shop(","function gameOver(","function showPanel(","function start(","mode='gameover'","mode='gameOver'","function showDebugTitle","function curtainExit(","mainAction.onclick","shopSelection="]:
            i=s.rfind(needle)
            print('DEBUG_HOOK',needle, 'INDEX',i, repr(s[max(0,i-900):i+2600]) if i>=0 else '')
          PY
      - name: Inspect player death and render control flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('zamajan-online/public/minigames/zamazone/index.html').read_text('utf8')
          s=s.split('// ZAMAZONE_PYRAMID_EYE_STAGE2_V1_20261116')[0]
          for needle in ['function damage(', 'function drawPlayer(', 'function draw(', 'function update(', 'function drawHUD(', 'function showPanel(', 'function gameOver(', 'function launchDebugBoss(', "player.hp<=0", "player.hp <= 0", "mode='dead'", "mode='gameOver'", "mode='gameover'", "mode='over'", 'function selectMusic(', 'function curtainExit(']:
            positions=[m.start() for m in re.finditer(re.escape(needle),s)]
            print('PLAYER_DEATH_HOOK',needle,'COUNT',len(positions))
            for at in positions[-2:]:
              print('PLAYER_DEATH_SOURCE',needle,repr(s[max(0,at-350):at+2100]))
          PY
      - name: Install Chromium for playable boss smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test actual gameplay boss encounter
        run: |
          python3 -m http.server 8765 --directory zamajan-online/public >/tmp/zamazone-test.log 2>&1 &
          sleep 2
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1552,height:930}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://localhost:8765/minigames/zamazone/index.html?stage2_qa=1',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForSelector('#zb-debug-open',{timeout:30000});
            await page.waitForTimeout(1400);
            console.log('DESERT_BOOT_DIAGNOSTIC',JSON.stringify(await page.evaluate(()=>({
              qa:window.ZAMAZONE_DESERT_REDESIGN_QA?.()||null,
              included:[...document.scripts].map(x=>x.src).filter(Boolean),
              desertScripts:[...document.scripts].filter(x=>x.src.includes('desert_redesign')).length,
              fetchFailures:performance.getEntriesByType('resource').filter(x=>x.name.includes('desert_redesign')).map(x=>({url:x.name,status:x.responseStatus,bytes:x.transferSize})).slice(0,30)
            }))));
            console.log('DESERT_BOOT_PAGE_ERRORS',JSON.stringify(errors));
            await page.waitForFunction(()=>{
              const q=window.ZAMAZONE_DESERT_REDESIGN_QA?.();
              return q&&Object.entries(q.assets).length===5&&Object.values(q.assets).every(v=>{
                const [ready,total]=v.split('/').map(Number);return ready===total;
              });
            },null,{timeout:20000});
            const desert=await page.evaluate(()=>window.ZAMAZONE_DESERT_REDESIGN_TEST?.smoke());
            // The five non-desert stage art rows MUST load, display five unique mobs
            // and the correct air/ground bases; stage 2 remains untouched.
            await page.waitForFunction(()=>Object.values(window.ZAMAZONE_BOARD_STAGE1356_QA?.()?.loaded||{}).every(Boolean),
              null,{timeout:20000});
            const boardStages=await page.evaluate(()=>
              [1,3,4,5,6].map(id=>window.ZAMAZONE_BOARD_STAGE1356_TEST.smoke(id)));
            console.log('BOARD_STAGE1356_ALL_FIVE_SMOKE',JSON.stringify(boardStages));
            if(boardStages.some(a=>!a.loaded||a.variants.join(',')!=='0,1,2,3,4'||
              a.delta.enemy<5||a.delta.air<1||a.delta.ground<1||
              a.delta.fragments<1||a.names.length!==7))
              throw Error('New board sprites failed to draw or shatter '+JSON.stringify(boardStages));
            await page.screenshot({path:'zamazone-board-all-stages.png',fullPage:true});
            console.log('DESERT_REDESIGN_SMOKE',JSON.stringify(desert));
            if(!desert||!desert.allLoaded||!desert.groundDead||!desert.airDead||
              desert.after.groundDraw<=desert.before.groundDraw||
              desert.after.airDraw<=desert.before.airDraw||
              desert.after.enemyDraw-desert.before.enemyDraw<8||
              desert.after.groundDestroyed<=desert.before.groundDestroyed||
              desert.after.airDestroyed<=desert.before.airDestroyed||
              desert.after.deathDraw-desert.before.deathDraw<2)
               throw Error('New Stage 2 desert art/hit boxes/deaths failed '+JSON.stringify(desert));
            await page.screenshot({path:'desert-base-enemy-art.png',fullPage:true});
            // Verify actual, unforced Stage 1 gameplay rendering, not synthetic smoke.
            const grassPage=await browser.newPage({viewport:{width:1280,height:720}});
            await grassPage.goto('http://localhost:8765/minigames/zamazone/index.html?stage2_qa=1',{waitUntil:'domcontentloaded',timeout:120000});
            await grassPage.waitForSelector('#zb-debug-open',{timeout:30000});
            await grassPage.waitForFunction(()=>window.ZAMAZONE_BOARD_STAGE1356_QA?.()?.loaded?.['1'],null,{timeout:20000});
            const startUI=await grassPage.evaluate(()=>{
              const btn=document.getElementById('mainAction');
              const ref=typeof mainAction!=='undefined'?mainAction:btn;
              const r=ref?.getBoundingClientRect();
              const center=r?document.elementFromPoint(r.left+r.width/2,r.top+r.height/2):null;
              return {buttonOuter:ref?.outerHTML?.slice(0,650),mode:typeof mode==='undefined'?'unknown':mode,
                panelHidden:document.getElementById('panelWrap')?.classList.contains('hidden'),
                rect:r?{x:r.x,y:r.y,w:r.width,h:r.height}:null,
                center:center?.outerHTML?.slice(0,250),
                visible:!!ref&&!!r&&r.width>1&&r.height>1};
            });
            console.log('PC_REAL_START_PRECHECK',JSON.stringify(startUI));
            if(!startUI.visible)throw Error('Main start button invisible '+JSON.stringify(startUI));
            try {await grassPage.locator('#mainAction').click({timeout:5000});}
            catch(e){console.log('PC_REAL_START_CLICK_ERROR',e.message.slice(0,750));await grassPage.evaluate(()=>mainAction.click());}
            await grassPage.waitForTimeout(300);
            const pcClick=await grassPage.evaluate(()=>window.ZAMAZONE_PC_START_QA?.());
            console.log('PC_START_RECOVERY',JSON.stringify(pcClick));
            if(!pcClick?.gameStarted||pcClick.clicks!==1||pcClick.failures!==0||!pcClick.panelHidden)
              throw Error('Real PC click did not start game '+JSON.stringify(pcClick));
            console.log('PC_REAL_START_AFTER',JSON.stringify(await grassPage.evaluate(()=>({
              mode:typeof mode==='undefined'?'unknown':mode,
              title:document.getElementById('panelTitle')?.textContent,
              panelHidden:document.getElementById('panelWrap')?.classList.contains('hidden'),
              err:window.ZAMAZONE_BOARD_STAGE1356_QA?.()
            }))));
            await grassPage.waitForTimeout(2800);
            const grassLive=await grassPage.evaluate(()=>window.ZAMAZONE_BOARD_STAGE1356_QA());
            console.log('STAGE1_LIVE_RENDER',JSON.stringify(grassLive));
            const stage1Real=grassLive.realDraws?.['1'];
            if(!stage1Real||stage1Real.enemy<1||stage1Real.ground<1||
               stage1Real.air<1||grassLive.legacyArtFallbacks!==0)
              throw Error('Stage 1 real sprite calls missing or older art is still visible '+JSON.stringify(grassLive));
            console.log('STAGE1_REAL_ART_SOURCE',JSON.stringify(stage1Real));
            // Exercise genuine game update/draw for all non-desert stages,
            // not merely synthetic sprite smoke calls.
            for(const id of [3,4,5,6]){
              const init=await grassPage.evaluate(sid=>window.ZAMAZONE_BOARD_STAGE1356_TEST.enterLiveStage(sid),id);
              if(init.stage!==id)throw Error('Cannot select gameplay stage '+id);
              await grassPage.waitForTimeout(1650);
              const live=await grassPage.evaluate(()=>window.ZAMAZONE_BOARD_STAGE1356_QA());
              const draws=live.realDraws?.[id];
              console.log('LIVE_STAGE_ART_CHECK',id,JSON.stringify({draws,failures:live.assetFailures,loaded:live.loaded[id]}));
              if(!draws||draws.enemy<2||draws.air<2||draws.ground<2||
                 live.legacyArtFallbacks!==0||!live.loaded[id])
                throw Error('Actual game is not drawing new stage '+id+' art '+JSON.stringify(live));
              await grassPage.screenshot({path:'stage'+id+'-new-enemies-and-bases.png',fullPage:true});
            }
            // Restore Stage 1 for the existing normal shop path test.
            await grassPage.evaluate(()=>window.ZAMAZONE_BOARD_STAGE1356_TEST.enterLiveStage(1));
            if(!grassLive.grassHQ||grassLive.grassArtVersion!=='source-HQ-160px'||grassLive.size['1']!==1120)
              throw Error('Grass must use full-sized ORIGINAL sprites, not placeholder vector shapes '+JSON.stringify(grassLive));
            if(!grassLive.active||grassLive.stage!==1||grassLive.ground<30||
               grassLive.air<5||grassLive.enemy<3||grassLive.grassSky<30||grassLive.grassScenery<30)
              throw Error('Real stage 1 still uses old sprites '+JSON.stringify(grassLive));
            await grassPage.screenshot({path:'stage1-live-art.png',fullPage:true});
            // Ordinary (non-debug) shop must also ask yes/no on exit.
            const normal=await grassPage.evaluate(()=>window.ZAMAZONE_SHOP_EXIT_TEST.openNormal());
            console.log('NORMAL_SHOP_OPEN',JSON.stringify(normal));
            if(normal.mode!=='shop'||!normal.open)throw Error('Could not enter normal shop');
            await grassPage.evaluate(()=>mainAction.click());
            if(!await grassPage.locator('#z-shop-exit-yes').count())throw Error('Normal shop confirmation missing');
            await grassPage.locator('#z-shop-exit-no').click();
            const cancelled=await grassPage.evaluate(()=>window.ZAMAZONE_SHOP_EXIT_TEST.status());
            if(cancelled.mode!=='shop'||cancelled.dialog)throw Error('No must keep normal shop open '+JSON.stringify(cancelled));
            await grassPage.evaluate(()=>mainAction.click());
            await grassPage.locator('#z-shop-exit-yes').click();
            await grassPage.waitForTimeout(850);
            const normalEnd=await grassPage.evaluate(()=>window.ZAMAZONE_SHOP_EXIT_TEST.status());
            console.log('NORMAL_SHOP_EXIT_CONFIRMED',JSON.stringify(normalEnd));
            if(normalEnd.mode!=='play'||!normalEnd.panelHidden)throw Error('Normal shop Yes failed '+JSON.stringify(normalEnd));
            await grassPage.close();
            // Keyboard activation must work for the same real title-screen action.
            const keyPage=await browser.newPage({viewport:{width:1280,height:800}});
            await keyPage.goto('http://localhost:8765/minigames/zamazone/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await keyPage.waitForSelector('#mainAction',{timeout:30000});
            await keyPage.locator('#mainAction').focus();
            await keyPage.keyboard.press('Enter');
            const kb=await keyPage.evaluate(()=>window.ZAMAZONE_PC_START_QA?.());
            console.log('PC_KEYBOARD_START',JSON.stringify(kb));
            if(!kb?.gameStarted||kb.clicks!==1||kb.failures!==0)
              throw Error('PC keyboard start failed '+JSON.stringify(kb));
            await keyPage.close();
            await page.click('#zb-debug-open');
            await page.click('[data-dbg-boss="3"]');
            await page.waitForSelector('[data-buy="0"]',{timeout:10000});
            const prep=await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA());
            console.log('FREE_DEBUG_SHOP_START',JSON.stringify(prep));
            if(!prep.prep||!prep.shopVisible||prep.choice!==3)throw Error('Pre-boss free equipment shop missing');
            const beforeMoney=prep.money;
            await page.locator('[data-buy="0"]').click();
            const purchased=await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA());
            console.log('FREE_DEBUG_SHOP_PURCHASE',JSON.stringify(purchased));
            if(!purchased.purchases[0]||purchased.money!==beforeMoney)throw Error('Debug equipment must be free');
            if(purchased.itemStatus.length!==12||!purchased.itemStatus[0].includes('強化済み')||
               !purchased.itemStatus[0].includes('1/1')||
               !purchased.itemPrices.every(p=>p==='無料（デバッグ）'))
              throw Error('Purchased state or free price not visible '+JSON.stringify(purchased));
            if(!await page.locator('[data-buy="0"]').isDisabled())throw Error('One-time upgrade must become disabled');
            await page.locator('[data-buy="5"]').click();
            await page.locator('[data-buy="5"]').click();
            const level2=await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA());
            if(level2.purchases[5]!==2||!level2.itemStatus[5].includes('2/3')||
               level2.money!==beforeMoney)throw Error('Upgrade tier not displayed '+JSON.stringify(level2));
            await page.locator('[data-buy="1"]').click();
            const gun=await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA());
            if(!gun.itemStatus[1].includes('現在装備中')||!gun.itemPrices.every(p=>p==='無料（デバッグ）'))
              throw Error('Equipped weapon not identified '+JSON.stringify(gun));
            if(!prep.exitVisible)throw Error('Debug shop must have a visible start button');
            await page.locator('#zb-debug-shop-start').click();
            if(!await page.locator('#z-shop-exit-confirm').count())throw Error('Debug exit confirmation missing');
            await page.locator('#z-shop-exit-no').click();
            if(!await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA()?.shopVisible))
              throw Error('No should keep shop open');
            await page.locator('#zb-debug-shop-start').click();
            await page.locator('#z-shop-exit-yes').click();
            const prepared=await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA());
            console.log('DEBUG_SHOP_CLICK_EXIT',JSON.stringify(prepared));
            if(prepared.prep||prepared.shopVisible||prepared.mode==='shop')throw Error('Debug shop failed to resume boss');
            await page.waitForTimeout(2400);
            const qa=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_QA?.());
            console.log('PYRAMID_EYE_STAGE2_QA',JSON.stringify(qa));
            await page.screenshot({path:'pyramid-eye-stage2.png',fullPage:true});
            if(!qa||!qa.active)throw Error('Stage2 Pyramid Eye not active');
            if(qa.stones.length!==16)throw Error('Missing orbiting stones');
            if(!qa.assetLoaded)throw Error('Pyramid Eye sprite not loaded');
            if(qa.stones.some(s=>s.y<0))throw Error('Intro stones still hidden above screen');
            if(qa.introFrameMaxJump>30)throw Error('Intro upward frame skip '+qa.introFrameMaxJump);
            await page.waitForFunction(()=>{const q=window.ZAMAZONE_PYRAMID_EYE_QA?.();return q&&q.entranceComplete&&q.mode!=='bossIntro';},null,{timeout:25000});
            await page.waitForFunction(()=>window.ZAMAZONE_PYRAMID_EYE_QA?.()?.introExitJump!==null,null,{timeout:5000});
            const transition=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_QA());
            console.log('INTRO_TO_COMBAT',JSON.stringify({frameMaxJump:transition.introFrameMaxJump,exitJump:transition.introExitJump}));
            if(transition.introFrameMaxJump>30||transition.introExitJump>30)throw Error('Boss introduction teleport '+JSON.stringify(transition));
            // Giant rock must rebound visibly at least twice while travelling from right to left.
            const billiard=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_TEST.simulateBounce());
            console.log('GIANT_BILLIARD',JSON.stringify(billiard));
            if(!billiard||billiard.totalBounces<2||billiard.samples.length<3)throw Error('Giant rock never rebounded');
            if(billiard.samples.at(-1).x>=billiard.samples[0].x)throw Error('Giant rock did not move left');
            if(!billiard.samples.some((x,i,a)=>i>0&&Math.sign(x.vy)!==Math.sign(a[i-1].vy)))throw Error('Giant rock vertical velocity did not reverse');
            // Acceptance: real-time, unforced attacks must be drawn on canvas.
            if(!await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_TEST.enableSpectator()))throw Error('spectator unavailable');
            await page.waitForFunction(()=>{
             const q=window.ZAMAZONE_PYRAMID_EYE_QA?.();
             return q&&q.drawChargeFrames>3&&q.drawRockFrames>3&&q.totalBounces>=2;
            },null,{timeout:35000});
            const natural=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_QA());
            console.log('NATURAL_VISIBLE_ATTACKS',JSON.stringify({chargeFrames:natural.drawChargeFrames,rockFrames:natural.drawRockFrames,bounces:natural.totalBounces,history:natural.attackHistory}));
            if(natural.attackHistory[0]!=='charge'||natural.attackHistory[1]!=='merge')throw Error('Signature attacks not first');
            if(natural.laserDrawFrames<3||natural.laserWarnings<3)throw Error('Eye laser not firing visibly during stone attacks '+JSON.stringify({frames:natural.laserDrawFrames,warnings:natural.laserWarnings}));
            await page.screenshot({path:'pyramid-eye-natural-attacks.png',fullPage:true});
            const front=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_TEST.eyeHit(6,false));
            if(!front||front.after!==front.before)throw Error('Eye must reject hits when turned away: '+JSON.stringify(front));
            const colors=[];
            for(let i=0;i<3;i++){
             const res=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_TEST.eyeHit(6,true));
             colors.push(res.color);
            }
            console.log('EYE_COLOR_SEQUENCE',JSON.stringify(colors));
            if(JSON.stringify(colors)!==JSON.stringify(['#3fbaff','#ffe02b','#ff354d']))throw Error('Eye colors not changed as required');
            const hits=await page.evaluate(()=>{
              const api=window.ZAMAZONE_HIT_FEEDBACK_TEST;
              return {blocked:api.blockedBossShot(),damaged:api.successfulBossShot(),
                base:api.baseHit(),enemy:api.enemyHit(),stats:window.ZAMAZONE_HIT_FEEDBACK_QA()};
            });
            console.log('UNIFIED_HIT_FEEDBACK',JSON.stringify(hits));
            if(!hits.blocked||hits.blocked.after.blocked<=hits.blocked.before.blocked||
              hits.blocked.after.damage!==hits.blocked.before.damage)throw Error('Blocked shot must trigger clank only');
            if(hits.damaged.eyeAfter>=hits.damaged.eyeBefore||hits.damaged.after.damage<=hits.damaged.before.damage||
              !hits.damaged.redUntil)throw Error('Damaging boss shot must trigger red slash');
            if(!hits.base||!hits.base.damage||hits.base.after.base<=hits.base.before.base||
              !hits.base.redUntil)throw Error('Base damage feedback missing');
            if(!hits.enemy||hits.enemy.enemyHP>=3||hits.enemy.after.enemy<=hits.enemy.before.enemy||
              !hits.enemy.redUntil)throw Error('Enemy damage feedback missing');
            if(!hits.stats.bossFlashLocal||hits.stats.bossFlashRadius>55||
              hits.stats.slashParticles!==0)throw Error('Boss red flash must affect only the hit region and no slash strokes '+JSON.stringify(hits.stats));
            const localFlash=await page.evaluate(()=>{
              const z=window.ZAMAZONE_HIT_FEEDBACK_QA(),q=window.ZAMAZONE_PYRAMID_EYE_QA();
              return {radius:z.bossFlashRadius,x:z.bossFlashX,y:z.bossFlashY};
            });
            if(localFlash.radius!==48)throw Error('Local boss impact flash incorrect '+JSON.stringify(localFlash));
            const forced=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_TEST.forceAttack('radial'));
            if(!forced)throw Error('Could not force 16-stone radial attack');
            await page.waitForFunction(()=>{
              const q=window.ZAMAZONE_PYRAMID_EYE_QA?.();
              return q&&q.stones.some(s=>s.alive&&s.xScreen<95);
            },null,{timeout:2900});
            const radial=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_QA());
            console.log('RADIAL_ATTACK',JSON.stringify(radial));
            if(radial.stones.length!==16||radial.stones.some(s=>!s.alive))throw Error('Stone lost during attack');
            if(radial.stones.every(s=>s.xScreen>95))throw Error('Stones did not reach left side');
            // Validate that destroyed stones never return and eight survivors are required to merge.
            const destroyed=await page.evaluate(()=>{
              for(let i=0;i<9;i++)if(!window.ZAMAZONE_PYRAMID_EYE_TEST.breakStone(i))throw Error('could not destroy '+i);
              return window.ZAMAZONE_PYRAMID_EYE_QA();
            });
            if(destroyed.remainingStones!==7||destroyed.stones.filter(s=>s.alive).length!==7)throw Error('stone destruction failed');
            if(await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_TEST.forceAttack('merge')))throw Error('merge wrongly allowed with seven stones');
            // One-by-one rapid stone salvo must move surviving rocks without regenerating nine broken stones.
            if(!await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_TEST.forceAttack('salvo')))throw Error('salvo unavailable');
            await page.waitForTimeout(1200);
            const salvo=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_QA());
            console.log('SEQUENTIAL_SALVO',JSON.stringify({phase:salvo.phase,attack:salvo.attack,remaining:salvo.remainingStones,x:salvo.stones.filter(s=>s.alive).map(s=>s.xScreen)}));
            if(salvo.remainingStones!==7||salvo.stones.some((s,i)=>i<9&&s.alive))throw Error('destroyed stones regenerated');
            // Boss body occasionally charges across the entire screen with a visible warning.
            // Real running-game charge must be visible, not only the deterministic QA simulation.
            if(!await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_TEST.forceAttack('charge')))throw Error('Live charge unavailable');
            await page.waitForFunction(()=>{
              const q=window.ZAMAZONE_PYRAMID_EYE_QA?.();
              return q&&q.attack==='charge'&&q.chargeFrameMinX!==null&&q.chargeFrameMinX<0;
            },null,{timeout:8500});
            const liveCharge=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_QA());
            console.log('LIVE_BODY_CHARGE',JSON.stringify({minX:liveCharge.chargeFrameMinX,x:liveCharge.chargeDisplayX,time:liveCharge.chargeTime}));
            const charge=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_TEST.simulateCharge());
            console.log('BODY_CHARGE',JSON.stringify(charge));
            if(!charge||charge.minX>175)throw Error('boss body failed to charge toward the left edge');
            const ended=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_TEST.eyeHit(6,true));
            console.log('PYRAMID_DEFEAT',JSON.stringify(ended));
            const internals=await page.evaluate(()=>({deathRenderer:typeof drawBossDeath,drawBossName:typeof drawBoss,defeat:typeof defeatBoss,
              mode:window.ZAMAZONE_PYRAMID_EYE_QA?.()?.mode}));
            console.log('DEFEAT_RENDERERS',JSON.stringify(internals));
            if(ended.after!==0)throw Error('Defeat not triggered');
            await page.waitForTimeout(1200);
            const post=await page.evaluate(()=>window.ZAMAZONE_PYRAMID_EYE_QA?.());
            if(post?.mode!=='bossDeath')throw Error('Boss defeat sequence did not continue '+JSON.stringify(post));
            await page.screenshot({path:'pyramid-eye-collapse.png',fullPage:true});
            // Debug death must allow retry via the preparation shop or return to boss select.
            await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_TEST.relaunch(3));
            await page.waitForFunction(()=>window.ZAMAZONE_DEBUG_BOSS_QA?.()?.shopVisible,null,{timeout:8000});
            await page.keyboard.press('Escape');
            if(!await page.locator('#z-shop-exit-yes').count())throw Error('Keyboard confirmation missing');
            await page.locator('#z-shop-exit-yes').click();
            const kbExit=await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA());
            console.log('DEBUG_SHOP_KEYBOARD_EXIT',JSON.stringify(kbExit));
            if(kbExit.prep||kbExit.shopVisible||kbExit.mode==='shop')throw Error('Keyboard Escape failed to exit shop');
            const over=await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_TEST.forceGameOver());
            console.log('DEBUG_BOSS_GAME_OVER',JSON.stringify(over));
            if(!over?.gameOver||!over.retry||!over.select)throw Error('Retry and select controls missing');
            await page.click('#zb-debug-retry');
            const retried=await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA());
            console.log('DEBUG_BOSS_RETRY',JSON.stringify(retried));
            if(!retried.prep||!retried.shopVisible||retried.choice!==3)throw Error('Retry failed to reopen same boss shop');
            // Retry must allow a controller's B / back button to exit as well.
            await page.evaluate(()=>{
              Object.defineProperty(navigator,'getGamepads',{configurable:true,value:()=>[
                {buttons:Array.from({length:16},(_,i)=>({pressed:i===1})),axes:[0,0]}
              ]});
            });
            await page.waitForSelector('#z-shop-exit-yes',{timeout:2500});
            await page.locator('#z-shop-exit-yes').click();
            await page.waitForFunction(()=>{
              const q=window.ZAMAZONE_DEBUG_BOSS_QA();return !q.prep&&!q.shopVisible&&q.mode!=='shop';
            },null,{timeout:2500});
            console.log('DEBUG_SHOP_GAMEPAD_EXIT',JSON.stringify(await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA())));
            await page.evaluate(()=>Object.defineProperty(navigator,'getGamepads',{configurable:true,value:()=>[]}));
            await page.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_TEST.forceGameOver());
            await page.click('#zb-debug-select');
            if(!await page.locator('[data-dbg-boss="3"]').count())throw Error('Return to boss selector failed');
            if(errors.length)throw Error('JS runtime errors '+errors.slice(0,5).join(' | '));
            // Regression: reproduce an actual smartphone touch interaction,
            // including viewport visibility and hit-testing of the fixed exit dock.
            const phone=await browser.newContext({viewport:{width:393,height:852},
              isMobile:true,hasTouch:true,deviceScaleFactor:3,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
            const mobile=await phone.newPage(),mobileErrors=[];
            mobile.on('pageerror',e=>mobileErrors.push(e.message));
            await mobile.goto('http://localhost:8765/minigames/zamazone/index.html?stage2_qa=1',{waitUntil:'domcontentloaded',timeout:120000});
            await mobile.waitForSelector('#zb-debug-open',{timeout:30000});
            await mobile.locator('#zb-debug-open').tap();
            await mobile.locator('[data-dbg-boss="3"]').tap();
            await mobile.locator('[data-buy="0"]').tap();
            const phonePurchase=await mobile.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA?.());
            console.log('MOBILE_PURCHASE_STATE',JSON.stringify({status:phonePurchase.itemStatus[0],price:phonePurchase.itemPrices[0],count:phonePurchase.purchases[0]}));
            if(!phonePurchase.itemStatus[0].includes('強化済み')||phonePurchase.itemPrices[0]!=='無料（デバッグ）')
              throw Error('Mobile purchase status unavailable');
            const bounds=await mobile.evaluate(()=>{
              const dock=document.getElementById('zb-mobile-shop-exit');
              const btn=document.getElementById('zb-mobile-shop-start');
              if(!dock||!btn)return {missing:true};
              const r=btn.getBoundingClientRect();
              const top=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);
              return {mode:window.ZAMAZONE_DEBUG_BOSS_QA?.()?.mode,
                x:r.x,y:r.y,width:r.width,height:r.height,vw:innerWidth,vh:innerHeight,
                hit:top?.id,visible:r.top>=0&&r.bottom<=innerHeight&&r.right<=innerWidth};
            });
            console.log('MOBILE_SHOP_BUTTON_BOUNDS',JSON.stringify(bounds));
            if(bounds.missing||bounds.mode!=='shop'||!bounds.visible||bounds.hit!=='zb-mobile-shop-start')
              throw Error('Phone cannot see or hit the exit button '+JSON.stringify(bounds));
            await mobile.screenshot({path:'pyramid-eye-mobile-shop.png',fullPage:true});
            await mobile.locator('#zb-mobile-shop-start').tap();
            if(!await mobile.locator('#z-shop-exit-yes').count())throw Error('Mobile exit dialog missing');
            await mobile.locator('#z-shop-exit-no').tap();
            if(!await mobile.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA()?.shopVisible))
              throw Error('Mobile No did not keep shop open');
            await mobile.locator('#zb-mobile-shop-start').tap();
            await mobile.locator('#z-shop-exit-yes').tap();
            const afterTap=await mobile.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_QA?.());
            console.log('MOBILE_SHOP_TOUCH_EXIT',JSON.stringify(afterTap));
            if(!afterTap||afterTap.prep||afterTap.shopVisible||afterTap.mobileDock||afterTap.mode==='shop')
              throw Error('Phone touch failed to enter boss '+JSON.stringify(afterTap));
            await mobile.evaluate(()=>window.ZAMAZONE_DEBUG_BOSS_TEST.relaunch(3));
            await mobile.locator('#zb-mobile-shop-back').tap();
            await mobile.locator('#z-shop-exit-yes').tap();
            if(await mobile.locator('#zb-mobile-shop-exit').count())throw Error('Phone dock still visible after back');
            if(!await mobile.locator('[data-dbg-boss="3"]').count())throw Error('Phone failed to return to boss selection');
            if(mobileErrors.length)throw Error('Mobile runtime errors '+mobileErrors.slice(0,5).join(' | '));
            await phone.close();
            // Integration regression: select mana4 from real boss debug UI and
            // fight with the main game's shot/damage hooks (not the standalone).
            const stage3Page=await browser.newPage({viewport:{width:1280,height:820}});
            const stage3Errors=[];stage3Page.on('pageerror',e=>stage3Errors.push(e.message));
            await stage3Page.goto('http://localhost:8765/minigames/zamazone/index.html?stage2_qa=1',{waitUntil:'domcontentloaded',timeout:120000});
            await stage3Page.waitForSelector('#zb-debug-open',{timeout:30000});
            await stage3Page.click('#zb-debug-open');
            await stage3Page.click('[data-dbg-boss="4"]');
            const selected=await stage3Page.evaluate(()=>window.ZAMAZONE_MANA4_LIVE_QA());
            console.log('MANA4_LIVE_SELECTED',JSON.stringify(selected));
            if(!selected.active||selected.stage!==3||selected.arms.length!==8||selected.mode!=='shop')
              throw Error('Stage3 mana4 boss not integrated '+JSON.stringify(selected));
            await stage3Page.click('#zb-debug-shop-start');
            await stage3Page.click('#z-shop-exit-yes');
            await stage3Page.waitForFunction(()=>window.ZAMAZONE_MANA4_LIVE_QA?.()?.mode==='play',null,{timeout:13000});
            const entering=await stage3Page.evaluate(()=>window.ZAMAZONE_MANA4_LIVE_QA());
            console.log('MANA4_LIVE_ENTERED',JSON.stringify(entering));
            if(entering.drawFrames<10)throw Error('Live boss not rendering');
            const hit=await stage3Page.evaluate(()=>window.ZAMAZONE_MANA4_LIVE_TEST.actualShot(0));
            console.log('MANA4_LIVE_SHOT',JSON.stringify(hit));
            if(hit.shotLife!==0||hit.arms[0].hp>=3)throw Error('Main-game projectile did not damage independent arm');
            const volley=await stage3Page.evaluate(()=>window.ZAMAZONE_MANA4_LIVE_TEST.forceVolley());
            if(volley.lastGroup<3||volley.lastGroup>5||volley.arms.filter(a=>a.warning>0).length!==volley.lastGroup)
              throw Error('Live boss must warn 3-5 arms simultaneously '+JSON.stringify(volley));
            const rain=await stage3Page.evaluate(()=>window.ZAMAZONE_MANA4_LIVE_TEST.forceBubble());
            if(rain.state!=='bubble')throw Error('Mana4 bubble phase failed');
            await stage3Page.waitForTimeout(2300);
            const bubbles=await stage3Page.evaluate(()=>window.ZAMAZONE_MANA4_LIVE_QA());
            console.log('MANA4_LIVE_BUBBLES',JSON.stringify(bubbles));
            if(bubbles.bubbles<35||bubbles.bubbles>145)throw Error('Live bubbles incorrect; JS_ERRORS '+JSON.stringify(stage3Errors));
            await stage3Page.screenshot({path:'mana4-live-boss-bubbles.png',fullPage:true});
            for(let k=0;k<8;k++)await stage3Page.evaluate(i=>window.ZAMAZONE_MANA4_LIVE_TEST.damageArm(i,3),k);
            const final=await stage3Page.evaluate(()=>window.ZAMAZONE_MANA4_LIVE_QA());
            console.log('MANA4_LIVE_FINAL',JSON.stringify(final));
            if(final.state!=='final'||final.arms.some(a=>!a.broken)||final.coreHP!==22)
              throw Error('Core phase not triggered after all arms broken');
            await stage3Page.waitForTimeout(120);
            await stage3Page.screenshot({path:'mana4-live-core.png',fullPage:true});
            const defeated=await stage3Page.evaluate(()=>window.ZAMAZONE_MANA4_LIVE_TEST.hitCore(22));
            console.log('MANA4_LIVE_DEFEATED',JSON.stringify(defeated));
            if(!defeated||defeated.bossAlive)throw Error('Core defeat did not trigger boss destruction');
            if(stage3Errors.length)throw Error('Mana4 live browser errors '+stage3Errors.join(' | '));
            await stage3Page.close();
            // A new campaign life-zero event must animate before the panel appears.
            const crystal=await page.evaluate(()=>window.ZAMAZONE_CRYSTAL_DEATH_TEST.normal());
            console.log('CRYSTAL_GAME_OVER_START',JSON.stringify(crystal));
            if(!crystal.active||crystal.shards<75||crystal.mode!=='crystalDeath'||!crystal.panelHidden)
              throw Error('Crystal shatter must begin before game-over panel '+JSON.stringify(crystal));
            await page.waitForTimeout(1150);
            const flight=await page.evaluate(()=>window.ZAMAZONE_CRYSTAL_DEATH_QA());
            console.log('CRYSTAL_GAME_OVER_FLIGHT',JSON.stringify(flight));
            if(!flight.active||flight.time<.7)throw Error('Crystal animation stopped prematurely');
            await page.screenshot({path:'zamazone-crystal-shatter.png',fullPage:true});
            await page.waitForFunction(()=>window.ZAMAZONE_CRYSTAL_DEATH_QA?.()?.mode==='lose',null,{timeout:5000});
            const end=await page.evaluate(()=>window.ZAMAZONE_CRYSTAL_DEATH_QA());
            console.log('CRYSTAL_GAME_OVER_END',JSON.stringify(end));
            if(end.active||end.deathCount<1)throw Error('Game over did not appear after crystal animation');
            if(errors.length)throw Error('Post-crystal runtime errors '+errors.slice(0,5).join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyramid-eye-stage2-smoke
          path: |
            pyramid-eye-stage2.png
            pyramid-eye-collapse.png
            desert-base-enemy-art.png
            pyramid-eye-natural-attacks.png
            pyramid-eye-mobile-shop.png
            zamazone-crystal-shatter.png
            stage1-live-art.png
            stage6-new-enemies-and-bases.png
            stage5-new-enemies-and-bases.png
            stage4-new-enemies-and-bases.png
            stage3-new-enemies-and-bases.png
            mana4-live-boss-bubbles.png
            mana4-live-core.png
            zamazone-board-all-stages.png
      - name: Commit integration to staging (production untouched)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zamajan-online/public/minigames/zamazone/index.html zamajan-online/public/minigames/zamazone/assets/pyramid_eye/
          if ! git diff --cached --quiet; then
            git commit -m "feat(zamazone): playable stage2 Pyramid Eye boss and merge bigrock"
            git push origin HEAD:chatgpt-staging
          fi
