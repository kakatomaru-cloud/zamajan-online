<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAMAZONE 可動パーツ ボス全動作プレビュー</title><style>
*{box-sizing:border-box}body{background:linear-gradient(135deg,#0a1028,#251441 65%,#070c1e);color:#f5f7ff;font:16px system-ui,sans-serif;margin:0;padding:20px}.wrap{max-width:1050px;margin:auto}h1{color:#ffe8a3;font-size:clamp(20px,3vw,32px)}p{color:#cbd9ff;line-height:1.6}.stage,.states{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}button{background:#29315c;border:2px solid #6e81ba;border-radius:12px;color:white;font-size:16px;font-weight:700;min-height:44px;padding:8px 16px;cursor:pointer}button.on{border-color:#ffe17c;background:#69407c;box-shadow:0 0 17px #d356ffa0}.scene{border:3px solid #8c72c2;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at center,#26305c,#090a24 65%);position:relative}canvas{width:100%;display:block;aspect-ratio:16/9}.caption{position:absolute;top:14px;left:14px;background:#080a239c;border:1px solid #6b83c5;border-radius:10px;padding:8px 12px;font-weight:700}.hint{font-size:14px}label{display:flex;align-items:center;gap:8px}</style></head><body><main class="wrap"><h1>ZAMAZONE｜可動パーツ ボスアニメーション</h1><p>mana3〜mana8を選択すると、中央の胴体・左右の翼・腕・下部装飾・上部パーツがそれぞれ別の軸で動きます。アニメーション状態は選択でき、すべての動きを自動再生することもできます。</p><div id="stages" class="stage"></div><div id="states" class="states"></div><div class="stage"><button id="auto" class="on">全動作を自動再生：ON</button><button id="pause">一時停止</button><button id="all">全ボスを順番に見る</button></div><div class="scene"><canvas id="c" width="960" height="540"></canvas><div id="status" class="caption">Loading...</div></div><p class="hint">キーボード：←→でボス切替、数字1〜6でmana3〜mana8、Spaceで一時停止。GitHub用のゲーム本体も同じ可動パーツを使用します。</p></main><script src="assets/boss_parts_rig.js"></script><script>
const cvs=document.querySelector('canvas'),ctx=cvs.getContext('2d'),stages=document.querySelector('#stages'),states=document.querySelector('#states'),label=document.querySelector('#status');
const modes=[['idle','待機'],['intro','登場'],['attack','攻撃'],['hit','被弾'],['death','撃破']];const attacks={3:['sand-vortex','stone-claw','scarab-fan','dune-eruption','pyramid-crush'],4:['bubble-mine','jelly-whip','tidal-ring','abyss-torpedo','pressure-pulse'],5:['ice-lance','frost-wing','crystal-barrage','glacier-ram','snowquake'],6:['neon-arc','street-drone','train-rush','billboard-smash','searchlight'],7:['datacube-grid','magnetic-arm','matrix-dash','binary-rain','circuit-burst'],8:['singularity-core','omni-claws','chaos-prism','event-horizon','fracture-wave','annihilation-laser']};
let n=3,mode='idle',t=0,cycle=0,automatic=true,play=true,all=false,last=performance.now();
function buttons(){stages.innerHTML='';for(let i=3;i<=8;i++){let b=document.createElement('button');b.textContent='mana'+i;b.classList.toggle('on',i===n);b.onclick=()=>{n=i;cycle=0;t=0;buttons()};stages.append(b);}states.innerHTML='';for(const [id,name]of modes){const b=document.createElement('button');b.textContent=name;b.classList.toggle('on',mode===id);b.onclick=()=>{mode=id;automatic=false;document.querySelector('#auto').classList.remove('on');cycle=0;t=0;buttons()};states.append(b);}}
buttons();document.querySelector('#auto').onclick=function(){automatic=!automatic;this.classList.toggle('on',automatic);this.textContent='全動作を自動再生：'+(automatic?'ON':'OFF')};document.querySelector('#pause').onclick=function(){play=!play;this.textContent=play?'一時停止':'再生'};document.querySelector('#all').onclick=function(){all=true;automatic=true;document.querySelector('#auto').classList.add('on');n=3;t=0;cycle=0;buttons()};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();play=!play;document.querySelector('#pause').textContent=play?'一時停止':'再生'}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){n=Math.max(3,Math.min(8,n+(e.key==='ArrowRight'?1:-1)));t=0;buttons()}if(/[1-6]/.test(e.key)&&e.key.length===1){n=2+Number(e.key);t=0;buttons()}});
function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(play){t+=dt;cycle+=dt;if(automatic&&cycle>2.5){cycle=0;let idx=modes.findIndex(m=>m[0]===mode);mode=modes[(idx+1)%modes.length][0];if(mode==='idle'&&all){n=n===8?3:n+1;}buttons()}}ctx.clearRect(0,0,960,540);
 const c=['#e3af6a','#4af2ef','#cbf3ff','#f770d7','#63ffcc','#f55dac'][n-3],grad=ctx.createRadialGradient(480,290,80,480,290,530);grad.addColorStop(0,'#2a3167');grad.addColorStop(1,'#070b23');ctx.fillStyle=grad;ctx.fillRect(0,0,960,540);
 ctx.strokeStyle=c+'55';for(let i=0;i<16;i++){ctx.beginPath();ctx.moveTo(i*80,440);ctx.lineTo(i*80+80,540);ctx.stroke()};ctx.fillStyle=c+'22';ctx.fillRect(0,460,960,80);
 const progress=mode==='intro'?Math.min(1,(cycle%2.5)/2.3):mode==='death'?Math.min(1,(cycle%2.5)/2.3):1;
 ctx.save();ctx.shadowBlur=22;ctx.shadowColor=c;ctx.strokeStyle=c;ctx.beginPath();ctx.ellipse(480,435,160,20,0,0,Math.PI*2);ctx.stroke();ctx.restore();
 if(window.ZamaBossRig)window.ZamaBossRig.render(ctx,480,260,n,t,{action:mode,attack:attacks[n][Math.floor(t/2.4)%attacks[n].length],progress});
 label.textContent=`mana${n} / ${modes.find(m=>m[0]===mode)[1]} / 7独立パーツ / ${mode==='attack'?attacks[n][Math.floor(t/2.4)%attacks[n].length]:'動作中'}`;
 requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
