</style></head><body><div class="wrap"><div class="titlebar"><div class="logo">⚡ ザマノイド <small>ZAMANOID · ARCADE DEMO</small></div><button id="mute" class="topbtn">🔊 SOUND ON</button></div><div class="gameframe"><canvas id="game" width="760" height="1120" aria-label="ザマノイド アルカノイド風ゲーム"></canvas><div id="toast"></div><div id="veil" class="veil"><div class="panel"><h1 id="panelTitle">ザマノイド</h1><p id="panelText">ZAMAPARの文字を崩しながら、最初から当たり判定のあるモアイを倒せ！<br>残機は1！ ゲーム開始時にランダムアイテム効果を1つ獲得。</p><p class="powers">2機パドル · 巨大化 · 4 / 8ボール · ミサイル · 貫通弾 · シールド · スロー · 高速 · キャッチ</p><button class="start" id="start">▶ GAME START</button><p style="font-size:13px">操作：マウス / ← → / A D で移動 · SPACE / クリックで発射 · Xでミサイル · Pで一時停止<br>スマホ：ドラッグで移動・タップで発射</p></div></div></div><div class="under"><span class="hint">ZAMAPARブロックを崩すとアイテムが落下！ モアイには開始直後から攻撃可能。倒せば即クリア！</span><div class="mobile"><button id="left">◀</button><button id="launch">発射</button><button id="rocket">🚀</button><button id="right">▶</button></div><button id="pause" class="smallbtn">⏸ 一時停止</button><button id="restart" class="smallbtn">↻ リスタート</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ZJ_PARAMS=new URLSearchParams(location.search);
const ZJ_RIICHI=ZJ_PARAMS.get('riichi')==='1' && window.parent!==window;
const ZJ_GAME_ID=ZJ_PARAMS.get('game')||'';
let zjSchedule=null,zjResultSent=false,zjStarted=false,zjGameReady=false;
function zjSend(type,extra={}){if(!ZJ_RIICHI)return;try{parent.postMessage({type,id:ZJ_GAME_ID,...extra},location.origin)}catch(e){}}
function zjReport(won){if(!ZJ_RIICHI||zjResultSent)return;zjResultSent=true;zjSend('zamajan-minigame-finished',{success:won===true});}
function zjMaybeStart(){if(!ZJ_RIICHI||!zjSchedule||zjStarted||zjResultSent)return;const now=Date.now();if(now>=zjSchedule.endsAt){zjReport(false);return}if(now>=zjSchedule.startsAt){zjStarted=true;startGame();launch();}}
window.addEventListener('message',ev=>{if(!ZJ_RIICHI||ev.origin!==location.origin||ev.source!==parent||ev.data?.type!=='zamajan-minigame-start'||ev.data.id!==ZJ_GAME_ID)return;const a=Number(ev.data.startsAt),b=Number(ev.data.endsAt);if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a)return;zjSchedule={startsAt:a,endsAt:b};zjMaybeStart()});
if(ZJ_RIICHI){const check=()=>{if(!zjGameReady)return;zjMaybeStart();if(zjStarted&&!zjResultSent&&zjSchedule&&Date.now()>=zjSchedule.endsAt){state='over';zjReport(false)}};setInterval(check,100);}
const W=760,H=1120,arena={l:42,r:718,t:140,b:1025};
let totalBricks=0,bossAttacksUnlocked=false;
let state='menu',last=performance.now(),time=0,score=0,hi=0,lives=1,balls=[],bricks=[],effects=[],missiles=[],particles=[],bossShots=[],paddleX=380,paddleVelocity=0,keys=new Set(),pointerX=null,trail=[],shakes=0,combo=0,level=1,toastTime=0,muted=false,ac=null,missileTimer=0,boss={x:380,y:220,hp:12,max:12,phase:0,flash:0,active:true,shots:2.1},power={twin:0,large:0,small:0,missile:0,pierce:0,shield:0,catch:0,slow:0,fast:0,bonus:0},currentPower='NONE';
const R=(a,b)=>Math.random()*(b-a)+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
try{hi=Number(localStorage.getItem('zamanoid-high')||0)}catch(e){}
function sound(f=500,d=.07,type='square',amp=.05,slide=0){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.setValueAtTime(Math.max(30,f),n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),n+d);g.gain.setValueAtTime(amp,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.006)}catch(e){}}
// Dedicated, original arcade-like plinks for brick, wall, paddle and boss.
function plink(kind){if(kind==='paddle'){sound(260,.09,'triangle',.11,260);sound(980,.025,'square',.018)}else if(kind==='wall')sound(500,.038,'triangle',.035,-90);else if(kind==='brick'){sound(520+Math.min(combo,8)*47,.065,'square',.055,-110)}else if(kind==='boss'){sound(130,.22,'sawtooth',.08,-70);sound(760,.1,'square',.03,400)}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function rndRect(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function glow(x,y,r,col,a=1){ctx.save();const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore()}function text(s,x,y,sz=20,color='#fff',align='left',weight=900){ctx.font=`${weight} ${sz}px system-ui,'Yu Gothic'`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y)}function line(ax,ay,bx,by,col,w=2){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke()}

function flashToast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');toastTime=2.3}
function makeBall(x=380,y=930,vx=R(-270,270),vy=-710,stuck=false){return{x,y,vx,vy,r:9,stuck,trail:[],energy:0}}
function resetBalls(){balls=[makeBall(paddleX,arena.b-40,210,-710,true)]}
function launch(){if(state!=='play'){if(state==='menu'||state==='over'||state==='win')startGame();return;}let did=false;balls.forEach(b=>{if(b.stuck){b.stuck=false;b.vx=R(-285,285)||210;b.vy=-760;did=true}});if(did)sound(380,.16,'sawtooth',.055,440)}
function startGame(){state='play';time=0;score=0;lives=1;combo=0;level=1;missiles=[];effects=[];particles=[];bossShots=[];paddleX=380;pointerX=null;for(let k in power)power[k]=0;boss={x:380,y:220,hp:ZJ_RIICHI?8:12,max:ZJ_RIICHI?8:12,phase:0,flash:0,active:true,shots:2.1};makeBricks();resetBalls();document.getElementById('veil').hidden=true;const p=powerDefs[Math.floor(Math.random()*powerDefs.length)];applyPower(p[0]);flashToast('🎁 START BONUS : '+p[1]);sound(420,.15,'triangle',.08,540)}
// 5x7 readable arcade pixel type rendered from actual destructible bricks.
const font={Z:['11111','00001','00010','00100','01000','10000','11111'],A:['01110','10001','10001','11111','10001','10001','10001'],M:['10001','11011','10101','10101','10001','10001','10001'],P:['11110','10001','10001','11110','10000','10000','10000'],R:['11110','10001','10001','11110','10100','10010','10001']};
function makeBricks(){
 bricks=[];const word='ZAMAPAR',bw=12,bh=14,space=3,letterWidth=5*bw+4*space,gap=12,total=word.length*letterWidth+(word.length-1)*gap;
 const sx=(W-total)/2,sy=372;
 for(let li=0;li<word.length;li++){
  const ch=font[word[li]];
  for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(ch[r][c]==='1'){
   const x=sx+li*(letterWidth+gap)+c*(bw+space),y=sy+r*(bh+4);
   bricks.push({x,y,w:bw,h:bh,hp:1,letter:true,hue:(li*40+r*6)%360});
  }
 }
 totalBricks=bricks.length;bossAttacksUnlocked=false;
}
function applyPower(id){const now=time;if(id==='multi4'||id==='multi8'){let count=id==='multi4'?4:8;let src=balls.find(b=>!b.stuck)||balls[0]||makeBall();let arr=[];for(let i=0;i<count;i++){let ang=-Math.PI+.12+(i+1)*(Math.PI-.24)/(count+1);let s=725;arr.push(makeBall(src.x,src.y,Math.cos(ang)*s,Math.sin(ang)*s,false));}balls=arr;}else{power[id]=now+({twin:19,large:21,small:13,missile:22,pierce:14,shield:22,catch:15,slow:16,fast:16,bonus:25}[id]||18);if(id==='large')power.small=0;if(id==='small')power.large=0;if(id==='fast')power.slow=0;if(id==='slow')power.fast=0;}currentPower=id;const d=powerDefs.find(a=>a[0]===id);flashToast('POWER UP! '+(d?.[1]||id));for(let i=0;i<26;i++)spark(paddleX,arena.b-35,R(-140,140),R(-210,10),'#ffdc8f',R(.4,1));sound(380,.22,'triangle',.08,720)}
function active(p){return power[p]>time}
function paddleWidth(){return active('large')?202:active('small')?68:132}
function paddles(){const w=paddleWidth();if(active('twin'))return[{x:clamp(paddleX-w*.6,arena.l+w/2,arena.r-w/2),w:w*.92},{x:clamp(paddleX+w*.6,arena.l+w/2,arena.r-w/2),w:w*.92}];return[{x:paddleX,w}]}
function spark(x,y,vx,vy,color,life=.6){particles.push({x,y,vx,vy,color,life,max:life,r:R(2,5)})}
function explode(x,y,col='#ffb565',n=18){for(let i=0;i<n;i++){let a=R(-Math.PI,Math.PI),s=R(60,280);spark(x,y,Math.cos(a)*s,Math.sin(a)*s,col,R(.25,.8));}shakes=Math.max(shakes,6);sound(140,.12,'sawtooth',.036,-70)}
function breakBrick(brick){brick.hp--;if(brick.hp>0){plink('brick');return}brick.dead=true;combo++;score+=(brick.letter?40:25)*(active('bonus')?2:1);plink('brick');if(Math.random()<.13)effects.push({x:brick.x+brick.w/2,y:brick.y,w:30,vy:130,id:powerDefs[Math.floor(Math.random()*powerDefs.length)][0],spin:0});for(let i=0;i<6;i++)spark(brick.x+brick.w/2,brick.y, R(-95,95),R(-80,85),`hsl(${brick.hue} 95% 67%)`,R(.25,.6));}
function brickCollision(ball){for(let i=bricks.length-1;i>=0;i--){let b=bricks[i];if(ball.x+ball.r<b.x||ball.x-ball.r>b.x+b.w||ball.y+ball.r<b.y||ball.y-ball.r>b.y+b.h)continue;let dx=Math.min(Math.abs(ball.x-b.x),Math.abs(ball.x-(b.x+b.w))),dy=Math.min(Math.abs(ball.y-b.y),Math.abs(ball.y-(b.y+b.h)));if(!active('pierce')){if(dx<dy)ball.vx*=-1;else ball.vy*=-1;}breakBrick(b);if(b.dead)bricks.splice(i,1);if(!active('pierce'))break;}}
function takeHit(){if(active('shield')){power.shield=0;flashToast('🛡 シールドが守った！');sound(440,.16,'triangle',.08);return;}lives--;explode(paddleX,arena.b-20,'#ff6b9d',28);balls=balls.filter(b=>b.stuck);if(lives<=0){endGame(false);return}resetBalls();flashToast('MISS! 残機 '+lives)}
function endGame(win){if(ZJ_RIICHI)zjReport(win===true);state=win?'win':'over';hi=Math.max(hi,score);try{localStorage.setItem('zamanoid-high',String(hi))}catch(e){}document.getElementById('veil').hidden=false;document.getElementById('panelTitle').textContent=win?'STAGE CLEAR!':'GAME OVER';document.getElementById('panelText').innerHTML=`スコア <b>${String(score).padStart(7,'0')}</b> ／ ハイスコア <b>${String(hi).padStart(7,'0')}</b><br>${win?'モアイを撃破！ ZAMAPAR制覇！':'もう一度挑戦してZAMAPARを崩そう！'}`;document.getElementById('start').textContent='▶ もう一度プレイ';sound(win?660:160,.45,win?'triangle':'sawtooth',.10,win?450:-95)}

function move(dt){
  let dest=paddleX;
  const keyboard=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);
  if(keyboard!==0){
    // Keyboard / on-screen direction buttons take control. Never return to a stale pointer location.
    pointerX=null;
    dest=paddleX+keyboard*860*dt;
  }else if(pointerX!==null){
    dest=pointerX;
  }
  dest=clamp(dest,arena.l+75,arena.r-75);
  paddleVelocity=(dest-paddleX)/Math.max(dt,.001);
  paddleX=dest;
}
function step(dt){if(state!=='play')return;time+=dt;shakes=Math.max(0,shakes-24*dt);if(toastTime>0){toastTime-=dt;if(toastTime<=0)document.getElementById('toast').classList.remove('show')}
move(dt);boss.phase+=dt;boss.x=380+Math.sin(boss.phase*.83)*150;boss.y=216+Math.sin(boss.phase*1.6)*17;boss.flash=Math.max(0,boss.flash-dt);boss.active=true;
// First let players clear at least 70% of the letter blocks without enemy shots.
// Once unlocked, the late-stage boss fires a gentler two-shot pattern.
if(!bossAttacksUnlocked && totalBricks>0 && bricks.length<=Math.floor(totalBricks*.30)){
  bossAttacksUnlocked=true; boss.shots=2.8;
  bossShots.length=0;
  flashToast('⚠ 終盤！ モアイが攻撃開始！');
  sound(220,.22,'sawtooth',.055,360);
}
if(boss.active && bossAttacksUnlocked){boss.shots-=dt;if(boss.shots<=0){
  for(let i=-1;i<=1;i+=2)bossShots.push({x:boss.x+i*24,y:boss.y+65,vx:i*65+Math.sin(time)*18,vy:190,r:10});
  boss.shots=2.55;plink('boss');
}}
for(let i=balls.length-1;i>=0;i--){let b=balls[i];if(b.stuck){b.x=paddleX;b.y=arena.b-49;continue}let speedMul=active('slow')?.88:active('fast')?1.25:1;b.trail.push({x:b.x,y:b.y});if(b.trail.length>7)b.trail.shift();let prevX=b.x,prevY=b.y;b.x+=b.vx*dt*speedMul;b.y+=b.vy*dt*speedMul;
if(b.x-b.r<=arena.l){b.x=arena.l+b.r;b.vx=Math.abs(b.vx);plink('wall')}if(b.x+b.r>=arena.r){b.x=arena.r-b.r;b.vx=-Math.abs(b.vx);plink('wall')}if(b.y-b.r<=arena.t){b.y=arena.t+b.r;b.vy=Math.abs(b.vy);plink('wall')}
if(b.vy>0&&prevY<arena.b-30&&b.y+b.r>=arena.b-30){for(const p of paddles()){if(Math.abs(b.x-p.x)<p.w/2+7){b.y=arena.b-39;b.vy=-Math.abs(b.vy);let angle=clamp((b.x-p.x)/(p.w/2),-1,1);b.vx=angle*520+paddleVelocity*.07;b.vx=clamp(b.vx,-650,650);if(Math.abs(b.vx)<115)b.vx=(Math.random()<.5?-1:1)*145;plink('paddle');if(active('catch')){b.stuck=true;b.y=arena.b-49}break}}}
brickCollision(b);
if(boss.hp>0&&Math.abs(b.x-boss.x)<94&&Math.abs(b.y-(boss.y+13))<78&&boss.flash<=0){boss.hp--;boss.flash=.22;b.vy=Math.abs(b.vy);b.vx+=R(-100,100);explode(b.x,b.y,'#ff628b',11);plink('boss');score+=250;if(boss.hp<=0){endGame(true);return}}
if(b.y>arena.b+35){balls.splice(i,1)}
}
if(!balls.length){takeHit()}
for(let i=missiles.length-1;i>=0;i--){let m=missiles[i];m.y+=m.vy*dt;let hit=false;for(let b of bricks){if(m.x>=b.x&&m.x<=b.x+b.w&&m.y>=b.y&&m.y<=b.y+b.h){breakBrick(b);hit=true;break}}bricks=bricks.filter(b=>!b.dead);if(boss.hp>0&&Math.abs(m.x-boss.x)<100&&Math.abs(m.y-boss.y)<85&&boss.flash<=0){boss.hp--;boss.flash=.18;score+=220;explode(m.x,m.y,'#ffb552',13);hit=true;if(boss.hp<=0){endGame(true);return}}
if(hit||m.y<arena.t)missiles.splice(i,1)}
for(let i=effects.length-1;i>=0;i--){let a=effects[i];a.y+=a.vy*dt;a.spin+=dt*5;if(a.y>=arena.b-50&&paddles().some(p=>Math.abs(a.x-p.x)<p.w/2+20)){applyPower(a.id);effects.splice(i,1)}else if(a.y>arena.b+30)effects.splice(i,1)}
for(let i=bossShots.length-1;i>=0;i--){let a=bossShots[i];a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.y>arena.b+30){bossShots.splice(i,1);continue}if(a.y>arena.b-43&&paddles().some(p=>Math.abs(a.x-p.x)<p.w/2+15)){bossShots.splice(i,1);takeHit();break}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
if(keys.has('x'))shootMissile();
}
function moai(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(boss.phase*1.65)*.055);ctx.scale(scale,scale);ctx.shadowColor=boss.flash?'#ff4778':'#ac65ff';ctx.shadowBlur=25;
if(moaiArt.complete&&moaiArt.naturalWidth){if(boss.flash>0)ctx.filter='saturate(150%) sepia(90%) hue-rotate(295deg) brightness(155%)';ctx.drawImage(moaiArt,-130,-118,260,236);ctx.filter='none';}
else{rndRect(-80,-100,160,200,15,'#89849d');glow(-35,-42,35,'#ff345b');glow(35,-42,35,'#ff345b');rect(-55,25,110,14,'#242335');}
ctx.restore()}
function drawBg(){
 rect(0,0,W,H,'#060921');const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#21104d');g.addColorStop(.50,'#090c2c');g.addColorStop(1,'#092847');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 glow(380,200,260,'#6945ff',.26);glow(380,880,350,'#02c7fa',.14);
 ctx.beginPath();ctx.arc(380,260,155,0,Math.PI*2);ctx.fillStyle='#5963c5';ctx.fill();glow(380,260,165,'#8c9eff',.20);
 for(let i=0;i<90;i++){let x=(i*173.7)%W,y=80+(i*91.3)%(H-140);rect(x,y,i%3?2:3,2,i%4?'#a5b8ff':'#ffdb9f')}
 for(const side of [24,W-24]){const gg=ctx.createLinearGradient(side-14,0,side+14,0);gg.addColorStop(0,'#352461');gg.addColorStop(.5,'#b68b88');gg.addColorStop(1,'#241c48');ctx.fillStyle=gg;ctx.fillRect(side-14,140,28,870);for(let y=148;y<1010;y+=78){rect(side-16,y,32,10,'#ba9577');rect(side-17,y,34,3,'#ffdf9e')}glow(side,900,55,'#ffab44',.28)}
 for(let j=0;j<7;j++){let x=j*125-15;ctx.fillStyle='#143151';ctx.beginPath();ctx.moveTo(x,915);ctx.lineTo(x+46,650+(j%3)*30);ctx.lineTo(x+100,915);ctx.fill();rect(x+28,815,33,103,'#164564')}
 for(let i=0;i<16;i++){let x=i*50;line(x,1018,x+40,1018,'#2876b8',2)}
 if(sceneryArt.complete&&sceneryArt.naturalWidth){ctx.globalAlpha=.40;ctx.drawImage(sceneryArt,37,715,180,294);ctx.save();ctx.translate(W-37,0);ctx.scale(-1,1);ctx.drawImage(sceneryArt,0,715,180,294);ctx.restore();ctx.globalAlpha=1}
}
function drawBrick(b){ctx.save();const hue=b.letter?b.hue:(190+b.hue/4)%360;let c=`hsl(${hue} 95% ${b.letter?51:42}%)`;ctx.shadowColor=c;ctx.shadowBlur=b.letter?11:5;rndRect(b.x,b.y,b.w,b.h,3,c);ctx.shadowBlur=0;rect(b.x+2,b.y+2,b.w-4,3,'#ffffff77');rect(b.x+2,b.y+b.h-4,b.w-4,2,'#1313329f');if(b.hp===2)rect(b.x+b.w/2-2,b.y+4,4,b.h-7,'#eaf8ff');ctx.restore()}
function drawPaddle(p){const y=arena.b-29;ctx.save();ctx.shadowBlur=20;ctx.shadowColor='#26bfff';rndRect(p.x-p.w/2,y-7,p.w,25,12,'#51c9ff');ctx.shadowBlur=0;rndRect(p.x-p.w/2+5,y-5,p.w-10,9,4,'#f1e7ff');rndRect(p.x-p.w/2+9,y+4,p.w-18,9,5,'#251e7a');glow(p.x,y+7,54,'#e46af9',.36);rndRect(p.x-16,y-10,32,27,8,'#f5a148');text('Z',p.x,y+12,19,'#2d124f','center');ctx.restore()}
function drawBall(b){for(let i=0;i<b.trail.length;i++){let p=b.trail[i];ctx.globalAlpha=i/b.trail.length*.45;glow(p.x,p.y,24,'#2bcfff',.3);rect(p.x-4,p.y-4,8,8,'#4fbdff')}ctx.globalAlpha=1;glow(b.x,b.y,32,active('pierce')?'#fc94b1':'#48bbff',.64);ctx.fillStyle=active('pierce')?'#ffb9a7':'#f9faff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3a99ff';ctx.lineWidth=3;ctx.stroke()}
function drawHud(){
 rndRect(37,12,686,113,13,'#060c26ef');ctx.lineWidth=2;ctx.strokeStyle='#b984e9';ctx.strokeRect(44,18,672,100);
 text('ZAMANOID',58,48,32,'#ffdc79');text(`SCORE ${String(score).padStart(7,'0')}`,410,46,22,'#fff');
 text(`♥ ${lives}   BALL ${balls.length}`,60,96,22,'#ffb5da');text('BOSS',380,92,19,'#ffe3a9');
 rndRect(458,76,243,21,5,'#392a5b');rndRect(462,80,235*Math.max(0,boss.hp/boss.max),13,4,'#ff527d');
 const labels=[];for(const [k,v] of Object.entries(power))if(v>time)labels.push(k.toUpperCase()+` ${Math.ceil(v-time)}s`);
 rndRect(49,1042,662,64,12,'#0a1537de');text('ITEM',63,1067,17,'#ffdf95');
 text(labels.slice(0,4).join(' · ')||'アイテムを取ってパワーアップ！',130,1067,16,'#9bf9ff');
 text('STAGE 1-1 · モアイを倒してクリア',63,1093,16,'#ffcf8b');
}
function render(){ctx.save();if(shakes>0)ctx.translate(R(-shakes,shakes),R(-shakes,shakes));drawBg();ctx.save();ctx.beginPath();ctx.rect(arena.l,arena.t,arena.r-arena.l,arena.b-arena.t);ctx.clip();
moai(boss.x,boss.y,.70)
for(const b of bricks)drawBrick(b);for(const a of effects){glow(a.x,a.y,32,'#e680ff',.5);ctx.beginPath();ctx.fillStyle='#b34dec';ctx.arc(a.x,a.y,20,0,2*Math.PI);ctx.fill();ctx.strokeStyle='#ffddb7';ctx.lineWidth=2;ctx.stroke();const d=powerDefs.find(p=>p[0]===a.id);text(d?.[2]||'?',a.x,a.y+7,23,'#fff','center')}
for(const p of paddles())drawPaddle(p);for(const b of balls)drawBall(b);for(const m of missiles){glow(m.x,m.y,22,'#ff874a',.75);text('🚀',m.x,m.y,25,'#fff','center')}for(const a of bossShots){glow(a.x,a.y,30,'#ff335e',.7);ctx.fillStyle='#ff6699';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,2*Math.PI);ctx.fill()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);rect(p.x,p.y,p.r,p.r,p.color)}ctx.globalAlpha=1;
if(active('shield')){glow(paddleX,arena.b-58,170,'#4dc8ff',.24);line(arena.l,arena.b-5,arena.r,arena.b-5,'#6cfdff',4)}ctx.restore();drawHud();ctx.restore()}
function loop(now){let dt=Math.min(.045,(now-last)/1000);last=now;if(state==='play'){let chunks=Math.ceil(dt/.012);for(let i=0;i<chunks&&state==='play';i++)step(dt/chunks);}render();requestAnimationFrame(loop)}
function pos(e){const b=canvas.getBoundingClientRect();return (e.clientX-b.left)*W/b.width}
let activeTouchPointer=null;
canvas.addEventListener('pointermove',e=>{
  // Mouse hover intentionally steers. Touch/pen only steer while dragging the canvas.
  if(e.pointerType==='mouse'||activeTouchPointer===e.pointerId){
    pointerX=clamp(pos(e),arena.l+75,arena.r-75);
  }
});
canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse')activeTouchPointer=e.pointerId;
  pointerX=clamp(pos(e),arena.l+75,arena.r-75);
  try{canvas.setPointerCapture(e.pointerId)}catch(_){ }
  launch();
});
function releasePointer(e){
  if(activeTouchPointer===e.pointerId){activeTouchPointer=null;pointerX=null;}
  try{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)}catch(_){ }
}
canvas.addEventListener('pointerup',releasePointer);
canvas.addEventListener('pointercancel',releasePointer);
canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse' && activeTouchPointer===null)pointerX=null;});
window.addEventListener('blur',()=>{pointerX=null;activeTouchPointer=null;keys.clear();});
window.addEventListener('keydown',e=>{
  let k=e.key.toLowerCase();
  if([' ','arrowleft','arrowright'].includes(k))e.preventDefault();
  if(['arrowleft','arrowright','a','d'].includes(k)){pointerX=null;activeTouchPointer=null;}
  keys.add(k);
  if(k===' '||k==='enter')launch();
  if(k==='p')togglePause();
  if(k==='x')shootMissile();
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function togglePause(){if(ZJ_RIICHI)return;if(state==='play'){state='pause';flashToast('⏸ PAUSE')}else if(state==='pause'){state='play';flashToast('▶ RESUME')}}
document.getElementById('start').onclick=()=>{if(!ZJ_RIICHI)startGame()};document.getElementById('pause').onclick=togglePause;document.getElementById('restart').onclick=()=>{if(!ZJ_RIICHI)startGame()};document.getElementById('mute').onclick=()=>{muted=!muted;document.getElementById('mute').textContent=muted?'🔇 SOUND OFF':'🔊 SOUND ON'};
function hold(id,key,extra){let e=document.getElementById(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(key==='arrowleft'||key==='arrowright'){pointerX=null;activeTouchPointer=null;}keys.add(key);extra?.();});for(let name of ['pointerup','pointerleave','pointercancel'])e.addEventListener(name,()=>keys.delete(key));}
hold('left','arrowleft');hold('right','arrowright');document.getElementById('launch').onclick=launch;document.getElementById('rocket').onclick=shootMissile;
resetBalls();makeBricks();requestAnimationFrame(loop);zjGameReady=true;if(ZJ_RIICHI){document.getElementById('start').disabled=true;document.getElementById('pause').disabled=true;document.getElementById('restart').disabled=true;document.getElementById('panelTitle').textContent='リーチ防衛・ザマノイド';document.getElementById('panelText').textContent='開始時刻を同期しています。モアイを撃破すれば防衛成功！';zjSend('zamajan-minigame-ready');}
window.ZAMANOID_DEBUG=()=>({state,score,lives,balls:balls.length,bricks:bricks.length,boss:{...boss},power:{...power},effects:effects.length,missiles:missiles.length});
})();
</script></body></html>
