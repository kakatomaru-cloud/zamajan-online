<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ザマじゃん リーチ強奪 STREET FIGHT - 10秒連打</title><style>
:root{color-scheme:dark;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c111c;color:#fff;min-height:100dvh;display:grid;place-items:center;padding:12px}main{width:min(1080px,100%)}h1{text-align:center;margin:5px 0 14px;font-size:clamp(21px,3.3vw,36px);color:#ffe3aa;text-shadow:0 2px 18px #c86a26}.sub{text-align:center;color:#abb9cb;font-size:13px;margin:-8px 0 12px}.panel{border:2px solid #be8d45;border-radius:17px;overflow:hidden;background:#131c2c;box-shadow:0 12px 46px #000a}.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;background:#0a1020}.side{flex:1;min-width:0}.side b{font-size:clamp(13px,2vw,20px)}.side small{display:block;color:#b5c1d7}.right{text-align:right}.num{font-size:clamp(28px,5vw,51px);font-weight:950;font-variant-numeric:tabular-nums;line-height:1.1}.red{color:#ffb46f}.blue{color:#71d4ff}.timer{font-size:clamp(28px,5vw,52px);font-weight:1000;color:#ffe6a4;text-align:center;min-width:95px}.timer small{display:block;font-size:11px;color:#bac5d0}.ring{position:relative;aspect-ratio:1672 / 941;background:#000;overflow:hidden;isolation:isolate;user-select:none}.ring img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .07s linear,transform .15s ease;pointer-events:none;transform:scale(1.012)}.ring img.active{opacity:1}.ring.punch-left img.active{transform:scale(1.045) translateX(7px)}.ring.punch-right img.active{transform:scale(1.045) translateX(-7px)}.ring.impact{animation:shake .19s ease-in-out}@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}.vfx{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%) scale(.3);font-size:clamp(24px,7vw,96px);font-weight:1000;color:#ffe68a;text-shadow:3px 4px #c03819,0 0 30px #ffe1a7;opacity:0;pointer-events:none}.vfx.show{animation:pop .25s}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}/* Finale: winners celebrate and defeated boxer staggers and drops */
.ring .endStage{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;display:none}
.ring.finished .endStage{display:none}
.endStage .champ,.endStage .fallen{position:absolute;bottom:8%;height:72%;width:37%;background-image:url('stance.jpg');background-repeat:no-repeat;background-size:auto 139%;background-position:0 38%;filter:drop-shadow(0 0 14px #ffca63a0);transform-origin:50% 85%}
.endStage .champ{left:11%;clip-path:polygon(12% 0,94% 0,100% 97%,0 100%);animation:champRise .65s ease-out both,champCelebrate .6s ease-in-out .65s infinite alternate}
.endStage .fallen{right:9%;background-position:100% 38%;clip-path:polygon(0 0,94% 0,100% 100%,0 99%);filter:grayscale(.35) brightness(.67);animation:fallenDrop 1.15s ease-in forwards}
.ring.rightwins .endStage .champ{left:auto;right:9%;background-position:100% 38%}
.ring.rightwins .endStage .fallen{right:auto;left:11%;background-position:0 38%}
.ring .endBurst{position:absolute;left:50%;top:23%;transform:translate(-50%,-50%);z-index:5;font-weight:1000;font-size:clamp(26px,5vw,72px);color:#ffe28b;text-shadow:0 5px 0 #843a19,0 0 30px #f60;white-space:nowrap;opacity:0}
.ring.finished .endBurst{animation:beltAppear 1s .4s both}
.ring.finished .endStage:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#ffd46c54,transparent 45%),linear-gradient(#03050aa8,#0009)}
.ring.draw .endStage .champ,.ring.draw .endStage .fallen{display:none}
@keyframes champRise{0%{opacity:.1;transform:translateY(30%) scale(.88)}50%{transform:translateY(-7%) scale(1.04)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes champCelebrate{0%{transform:translateY(0) rotate(-2deg)}100%{transform:translateY(-12px) rotate(3deg)}}
@keyframes fallenDrop{0%{opacity:1;transform:translateY(0) rotate(0)}30%{transform:translateY(2%) rotate(9deg)}80%{opacity:.93;transform:translateY(40%) rotate(48deg)}100%{opacity:.6;transform:translateY(67%) rotate(74deg)}}
@keyframes beltAppear{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.centerMessage{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#0307109e;z-index:4;padding:12px}.centerMessage.hidden{display:none}.ring.finished .centerMessage{inset:auto 3% 3%;background:none;display:flex;justify-content:center;align-items:end;pointer-events:none}.ring.finished .messageBox{padding:8px 15px;background:#09121bdf;border-width:1px}.ring.finished .messageBox strong{font-size:clamp(17px,3.1vw,30px)}.ring.finished .messageBox p{font-size:clamp(12px,1.8vw,16px);margin:3px 0}.messageBox{background:#090f1be8;padding:20px 26px;border:2px solid #d6a451;border-radius:16px;max-width:95%;box-shadow:0 8px 38px #000e}.messageBox strong{display:block;font-size:clamp(24px,4vw,43px);color:#ffde8f}.messageBox p{margin:7px 0 0;line-height:1.6}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.hit{border:2px solid #f6b55a;background:linear-gradient(#ed7a38,#9d2425);color:white;border-radius:14px;min-height:90px;font-weight:900;font-size:clamp(20px,3vw,32px);touch-action:manipulation;user-select:none;cursor:pointer;box-shadow:0 6px 0 #5e2220}.hit.b{background:linear-gradient(#378bdc,#164ba8);border-color:#81d5ff;box-shadow:0 6px 0 #09335d}.hit:active{transform:translateY(4px);box-shadow:0 2px 0 #333}.hit:disabled{filter:grayscale(.75);opacity:.45}.control{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;align-items:center}button.small,select{border:1px solid #9bbaef;border-radius:9px;padding:12px;color:#fff;background:#243b5b;font-weight:700;cursor:pointer}button.primary{background:#0d795d;border-color:#7bf2b6;padding:13px 26px}.note{text-align:center;color:#b5c0d2;font-size:13px;line-height:1.6}.note span{color:#ffdb97}#flash{position:absolute;inset:0;background:#ffffff12;opacity:0;pointer-events:none}#flash.on{animation:flash .15s}@keyframes flash{50%{opacity:.45}}@media(max-width:590px){.hud{padding:8px}.buttons{gap:8px;padding:8px}.hit{min-height:95px}.ring{aspect-ratio:16 / 10}.ring img{object-fit:cover}.messageBox{padding:12px}.side small{font-size:10px}}

/* Dedicated finale scene. Result-image only, no duplicate live text. */
.ring .victoryScene{display:none;position:absolute;inset:0;width:100%;height:100%;z-index:3;overflow:hidden;background:#080c17}
.ring.finished:not(.draw) .victoryScene{display:block;animation:victoryReveal .5s ease both}
.ring .victoryScene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;transform:none;max-width:none;transition:none}
.ring.rightwins .victoryScene img{transform:scaleX(-1)}
.ring.finished .victoryScene:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 42%,#0009 80%);pointer-events:none}
.ring.finished .endBurst{z-index:6;top:24%;font-size:clamp(32px,7vw,90px)}
.ring.finished .centerMessage{z-index:7;bottom:4%}
@keyframes victoryReveal{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:scale(1)}}

/* Result image contains its own KO and success caption; do not overlay duplicate HUD/UI. */
.ring.finished .endBurst,.ring.finished .centerMessage,.ring.finished .vfx,.ring.finished .endStage{display:none!important}
.ring.finished .victoryScene:after{display:none!important}
.panel.result-only .hud,.panel.result-only .buttons{display:none!important}
.panel.result-only .ring{aspect-ratio:1672 / 941}
.panel.result-only .ring .victoryScene{display:block!important}
.panel.result-only .ring .victoryScene img{object-fit:contain!important}
body.returned main{display:none}
.returnNotice{display:none;min-height:80dvh;place-content:center;text-align:center;padding:30px;color:#ffe3aa;font-size:24px}
body.returned .returnNotice{display:grid}
</style></head><body><div class="returnNotice">対決終了<br><small>テスト版です。ザマじゃん本体への接続は未実装です。</small><button style="margin:20px auto;border:1px solid #d5ac62;border-radius:12px;background:#8b331c;color:#fff;padding:14px 26px;font-size:18px;cursor:pointer" onclick="document.body.classList.remove('returned');window.zamajanStartBoxingMiniGame()">もう一度遊ぶ</button></div><main><h1>🔥 リーチ強奪 RYU vs KEN</h1><p class="sub">10秒間の連打勝負！ 使用者が勝てばリーチを強奪</p><div class="panel"><div class="hud"><div class="side"><b class="red">🔴 使用者・リュウ</b><small>Aキー / 左ボタン</small><div class="num red" id="scoreA">0</div></div><div class="timer" id="timer">10.0<small>SECONDS</small></div><div class="side right"><b class="blue">🔵 防衛者・ケン</b><small>Lキー / 右ボタン</small><div class="num blue" id="scoreB">0</div></div></div><div class="ring" id="ring"><img src="stance.jpg" class="active" id="stance" alt="ストリートファイターがネオン裏路地で対峙"><img src="left_punch.jpg" id="left" alt="使用者の攻撃"><img src="right_punch.jpg" id="right" alt="防衛者の攻撃"><img src="alternate.jpg" id="alternate" alt="試合中の構え"><div class="victoryScene" aria-hidden="true"><img id="victoryImage" src="ryu_win.jpg" alt="リュウとケンの勝敗結果"></div><div class="endStage" aria-hidden="true"><div class="champ"></div><div class="fallen"></div></div><div class="endBurst" id="endBurst"></div><div id="flash"></div><div class="vfx" id="vfx">HIT!</div><div class="centerMessage" id="overlay"><div class="messageBox"><strong id="message">READY?</strong><p id="detail">3秒カウントダウン後に自動開始します。</p></div></div></div><div class="buttons"><button class="hit" id="btnA" disabled>👊 攻撃！<br><small>使用者 / A</small></button><button class="hit b" id="btnB" disabled>👊 攻撃！<br><small>防衛者 / L</small></button></div></div><div id="audioNote" hidden style="text-align:center;padding:9px;background:#633317;border-radius:8px;margin-top:8px">ブラウザが自動再生を制限しています。<button id="enableAudio" class="small" type="button">🔊 音楽を有効にする</button></div><div class="control"><label for="mode">モード</label><select id="mode"><option value="cpu">CPUと対戦（1人用）</option><option value="two">同じ端末で2人対戦</option></select><button class="small primary" id="start">▶ もう一度対決</button><button class="small" id="reset">リセット</button></div><p class="note">GO!からstreet.mp3を再生し、勝負の10秒後にBGMを停止します。ボタン連打でリュウとケンの格闘シーンを切り替えます。<br>※これは<strong>独立テスト版</strong>です。オンライン通信対戦には未接続です。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),music=new Audio('street.mp3');music.preload='auto';music.loop=false;imgs=['stance','left','right','alternate'];let running=false,counting=false,countdownTimers=[],endAt=0,raf=0,cpu=0,a=0,b=0,restore=0,lastFighter='',hits=0,prev=0,returnTimer=0;const setScore=()=>{$('scoreA').textContent=a;$('scoreB').textContent=b};function show(id){imgs.forEach(x=>$(x).classList.toggle('active',x===id))}function hit(side){if(!running)return;if(side==='a')a++;else b++;hits++;setScore();lastFighter=side;const node=side==='a'?'left':'right';show(node);$('ring').className='ring punch-'+(side==='a'?'left':'right');$('ring').classList.remove('impact');void $('ring').offsetWidth;$('ring').classList.add('impact');const v=$('vfx');v.textContent=['HIT!','POW!','BAM!'][hits%3];v.classList.remove('show');void v.offsetWidth;v.classList.add('show');const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');clearTimeout(restore);restore=setTimeout(()=>{if(running){show(hits%4===0?'alternate':'stance');$('ring').className='ring'}},165)}function stop(){if(!running)return;music.pause();music.currentTime=0;running=false;cancelAnimationFrame(raf);clearInterval(cpu);cpu=0;clearTimeout(restore);$('btnA').disabled=$('btnB').disabled=true;$('victoryImage').src=a>b?'ryu_win.jpg':'ken_win.jpg';show('stance');$('ring').className='ring finished '+(a>b?'leftwins':b>a?'rightwins':'draw');$('endBurst').textContent='';$('timer').innerHTML='0.0<small>SECONDS</small>';let title,detail;if(a>b){title='🔴 強奪成功！';detail='使用者の勝利！ '+a+' 対 '+b+' パンチ。リーチを奪えます。'}else if(a<b){title='🔵 防衛成功！';detail='防衛者の勝利！ '+a+' 対 '+b+' パンチ。リーチ強奪は失敗。'}else{title='DRAW ― 強奪失敗';detail='同点 '+a+' 対 '+b+'。引き分けではリーチを奪えません。'}$('message').textContent=title;$('detail').textContent=detail;$('overlay').classList.add('hidden');$('ring').closest('.panel').classList.add('result-only');if(a<=b){$('ring').closest('.panel').classList.remove('result-only');$('ring').classList.remove('finished');$('overlay').classList.remove('hidden');$('overlay').style.background='#060b18c9';}$('start').disabled=false;$('mode').disabled=false;const result={winner:a>b?'attacker':b>a?'defender':'draw',attackerCount:a,defenderCount:b,stealSucceeded:a>b};clearTimeout(returnTimer);returnTimer=setTimeout(()=>returnToGame(result),3000)}function tick(){if(!running)return;const r=Math.max(0,(endAt-performance.now())/1000);$('timer').innerHTML=r.toFixed(1)+'<small>SECONDS</small>';if(r<=0)stop();else raf=requestAnimationFrame(tick)}function begin(){if(running||counting)return;a=b=hits=0;setScore();show('stance');$('ring').className='ring';$('overlay').classList.add('hidden');$('mode').disabled=true;$('start').disabled=true;$('btnA').disabled=false;$('btnB').disabled=$('mode').value==='cpu';running=true;endAt=performance.now()+10000;music.currentTime=0;music.play().catch(()=>{ $('audioNote').hidden=false; });tick();if($('mode').value==='cpu'){function cpuHit(){if(!running)return;hit('b');const delay=190+Math.random()*170;cpu=setTimeout(cpuHit,delay)}cpu=setTimeout(cpuHit,400)}}function reset(){music.pause();music.currentTime=0;$('audioNote').hidden=true;clearTimeout(returnTimer);document.body.classList.remove('returned');$('ring').closest('.panel').classList.remove('result-only');counting=false;countdownTimers.forEach(clearTimeout);countdownTimers=[];running=false;cancelAnimationFrame(raf);clearTimeout(cpu);clearTimeout(restore);a=b=hits=0;setScore();$('timer').innerHTML='10.0<small>SECONDS</small>';$('mode').disabled=false;$('start').disabled=false;$('btnA').disabled=$('btnB').disabled=true;show('stance');$('ring').className='ring';$('message').textContent='READY?';$('detail').textContent='3秒カウントダウン後に自動開始します。';$('overlay').classList.remove('hidden');$('overlay').style.background=''}function returnToGame(result){
 // Embedding page listens for this result and closes the boxing modal/iframe.
 if(window.parent!==window){window.parent.postMessage({type:'zamajan-boxing-finished',...result},window.location.origin);document.body.classList.add('returned');return}
 // A scripted popup may close itself; a directly opened local HTML cannot.
 if(window.opener){window.opener.postMessage({type:'zamajan-boxing-finished',...result},window.location.origin);window.close()}
 // Standalone launch has no original game screen; keep a replay control instead.
 document.body.classList.add('returned');
}
let lastA=0,lastB=0;function press(side){const now=performance.now();if(side==='a'){if(now-lastA<22)return;lastA=now}else{if(now-lastB<22)return;lastB=now}hit(side)}$('btnA').addEventListener('pointerdown',e=>{e.preventDefault();press('a')});$('btnB').addEventListener('pointerdown',e=>{e.preventDefault();press('b')});document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key.toLowerCase()==='a'){if(running){e.preventDefault();press('a')}}if(e.key.toLowerCase()==='l'&&$('mode').value==='two'){if(running){e.preventDefault();press('b')}}});function startWithCountdown(){
 if(running||counting)return;
 reset();counting=true;
 $('mode').disabled=true;$('start').disabled=true;
 $('overlay').classList.remove('hidden');
 $('detail').textContent='ストリートファイト開始まで…';
 $('message').textContent='3';
 [2,1,'GO!'].forEach((value,index)=>countdownTimers.push(setTimeout(()=>{
   if(!counting)return;
   $('message').textContent=String(value);
   if(value==='GO!')$('detail').textContent='連打！連打！連打！';
 },(index+1)*1000)));
 countdownTimers.push(setTimeout(()=>{if(!counting)return;counting=false;begin()},3400));
 }
 $('enableAudio').onclick=()=>{music.play().then(()=>$('audioNote').hidden=true).catch(()=>{})};$('start').onclick=startWithCountdown;
 $('reset').onclick=()=>{reset();startWithCountdown()};
 // Standalone demo: launching the mini game simulates using the item.
 reset();startWithCountdown();
 window.zamajanStartBoxingMiniGame=startWithCountdown})();
</script></body></html>
