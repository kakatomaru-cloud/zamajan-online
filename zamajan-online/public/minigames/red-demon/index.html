</style></head><body><audio id="battleBgm" src="assets/battle_bgm.mp3" preload="auto" loop></audio><main><header><h1>⚔ 魔界の赤き翼 <span style="font-size:.5em;color:#d79875">BOSS DUEL</span></h1><div class="subtitle">ザマじゃん ミニゲーム試作｜月夜の廃城決戦・操作可能デモ</div></header><div id="stage"><canvas id="game" width="480" height="270" aria-label="赤い悪魔との横スクロール風アクションゲーム"></canvas><div class="overlay" id="overlay"><img id="artPreview" src="assets/battle_preview.png" alt="月夜の廃城決戦イメージ" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38;pointer-events:none"><div class="panel"><h2 id="head">赤き翼を撃破せよ！</h2><p id="description">左右移動・ジャンプ・ヤリを駆使して赤い悪魔を倒せ。<br><strong>敵に4発当てれば勝利。</strong> ダメージを受けると鎧が壊れ、次の一撃で敗北。</p><p class="muted" id="instructions">PC：<kbd>←</kbd> <kbd>→</kbd>移動／<kbd>↓</kbd>しゃがむ／<kbd>SPACE</kbd>・右クリックでジャンプ／<kbd>L</kbd>・左クリックでヤリ<br>スマホ：画面下のボタンで操作</p><div id="count" class="count">3</div><button id="retry" class="primary" style="display:none">もう一度挑戦</button></div></div></div><div style="margin:9px 0;text-align:right"><button type="button" id="bgmToggle" class="primary" style="margin:0;min-height:38px;font-size:13px">🔊 BGMを有効にする</button></div><div class="controls"><div class="group"><button data-key="left" aria-label="左移動">◀</button><button data-key="right" aria-label="右移動">▶</button><button data-key="down" aria-label="しゃがむ">▼</button></div><div class="group"><button data-key="jump">ジャンプ</button><button data-key="attack">ヤリ</button></div></div><div class="status"><span>5種類のランダムAI：空中追跡・急降下・火球・地表すれすれ・高速体当たり</span><span id="message">開始まで3秒</span><span>※画像付き独立デモ／ザマじゃん本体とは未連携</span></div></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),c=canvas.getContext('2d');c.imageSmoothingEnabled=false;const overlay=document.getElementById('overlay'),head=document.getElementById('head'),desc=document.getElementById('description'),instructions=document.getElementById('instructions'),count=document.getElementById('count'),retry=document.getElementById('retry'),message=document.getElementById('message');const W=480,H=270,ground=217;const keys={left:false,right:false,down:false,jump:false,attack:false};let state='intro',p,e,spears=[],fireballs=[],sparks=[],clock=0,prev=0,frame=0,session=0,throwCooldown=0,inv=0,shake=0,score=0,deathTimer=0;const music=document.getElementById('battleBgm'), bgmToggle=document.getElementById('bgmToggle'); let musicEnabled=true; music.volume=.55; function playMusic(){if(!musicEnabled)return;const task=music.play();if(task&&task.catch)task.catch(()=>{bgmToggle.textContent='🔊 タップしてBGM再生';});}function stopMusic(){music.pause();music.currentTime=0;}bgmToggle.addEventListener('click',()=>{if(music.paused){musicEnabled=true;playMusic();bgmToggle.textContent='🔇 BGMを止める';}else{musicEnabled=false;music.pause();bgmToggle.textContent='🔊 BGMを再生';}}); const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));function sound(f=250,d=.1,t='square',vol=.018){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let o=audioCtx.createOscillator(),v=audioCtx.createGain();o.type=t;o.frequency.value=f;v.gain.setValueAtTime(vol,audioCtx.currentTime);v.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(v);v.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(_){}}
function init(){p={x:112,y:ground-29,w:15,h:29,vy:0,vx:0,face:1,armor:1,jump:false,locked:0,knockX:0,knockTime:0,hurtTime:0,deathSpin:0};e={x:350,y:ground-30,w:21,h:30,hp:4,mode:'perch',timer:.65,vx:0,vy:0,targetX:310,targetY:90,first:true,shootCd:0,phase:0,pattern:'aerial',lastPattern:null,fireClock:0,shot:false,stun:0,transitionTime:0,stunFlash:0,immune:0,frenzy:0,patternCount:0};spears=[];fireballs=[];sparks=[];clock=0;frame=0;throwCooldown=0;inv=0;score=0;shake=0;deathTimer=0;prev=performance.now();}
const pixel=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};const art={};for(const name of ['cemetery','knight_idle','knight_run','knight_jump','knight_throw','demon_idle','demon_fly','demon_dive','demon_fire',...Array.from({length:6},(_,i)=>'armor_run_'+i),...Array.from({length:8},(_,i)=>'armor_walk_'+i),...Array.from({length:6},(_,i)=>'naked_run_'+i),'naked_idle','naked_jump','naked_throw','spear_new','skull']){let im=new Image();im.src='assets/'+name+'.png';art[name]=im;}

function background(){bgImage(art.cemetery,0,0,W,H);c.fillStyle='#050815d9';c.fillRect(0,0,W,20);c.fillStyle='#382824';c.fillRect(8,5,105,8);c.fillStyle=p.armor?'#bbc9e0':'#eb9477';c.fillRect(9,6,p.armor?103:48,6);c.fillStyle='#4e202d';c.fillRect(356,5,113,8);c.fillStyle='#f05244';c.fillRect(357,6,Math.max(0,111*e.hp/4),6);c.font='bold 7px monospace';c.fillStyle='#ffebbb';c.fillText('KNIGHT',9,24);c.fillText('RED DEMON',416,24);}
function knight(){

  which=p.jump?'naked_jump':throwCooldown>.21?'naked_throw':Math.abs(p.vx)>5?'naked_run_'+(Math.floor(clock*12)%6):'naked_idle';

  dx=p.x-17; dy=p.y-14; w=48; h=46;

}
function demon(){let fly=e.mode==='pattern'&&['aerial','swoop','fire'].includes(e.pattern);let which=['swoop','skim','charge'].includes(e.pattern)?'demon_dive':e.pattern==='fire'?'demon_fire':fly?'demon_fly':'demon_idle';const im=art[which];c.save();if(Math.sin(e.phase*9)>0&&fly)c.translate(0,-2);bgImage(im,e.x-17,e.y-16,59,56);if(e.mode==='transition'){c.fillStyle='#ffe3a4';c.font='bold 13px monospace';c.fillText('!',e.x+6,e.y-18);}if(e.immune>0&&Math.floor(clock*22)%2){c.globalAlpha=.48;}if(e.frenzy>0){c.fillStyle='#ff624a';c.font='bold 9px monospace';c.fillText('RAGE!',e.x-3,e.y-26);}if(e.stun>0){c.fillStyle='#fff2a3';c.font='bold 10px monospace';c.fillText('★',e.x+7,e.y-18);}c.restore();}
// Five patterns, selected again after every attack: aerial hunt, dive, fireball, ground skim, body charge.
const DEMON_PATTERNS=['aerial','swoop','fire','skim','charge'];

function moveDemon(dt){

 if(e.mode==='transition'){e.transitionTime-=dt;e.x+=(cl(p.x+(e.pattern==='fire'?115:e.pattern==='skim'?140:90)*(e.x>p.x?1:-1),25,435)-e.x)*Math.min(1,dt*1.8);e.y+=( (e.pattern==='skim'||e.pattern==='charge'?ground-31:85)-e.y)*Math.min(1,dt*3);if(e.transitionTime<=0){e.mode='pattern';e.timer+=.15;}return;}

function start(){stopMusic();const id=++session;state='intro';init();head.textContent='赤き翼を撃破せよ！';desc.innerHTML='左右移動・ジャンプ・ヤリを駆使して赤い悪魔を倒せ。<br><strong>敵に4発当てれば勝利。</strong> ダメージを受けると鎧が壊れ、次の一撃で敗北。';instructions.innerHTML='PC：← → 移動／↓ しゃがむ／スペース・右クリックでジャンプ／L・左クリックでヤリ<br>スマホ：画面下のボタンで操作';count.style.display='block';retry.style.display='none';overlay.classList.remove('hidden');let n=3;count.textContent=n;const interval=setInterval(()=>{if(id!==session){clearInterval(interval);return}n--;if(n>0){count.textContent=n;sound(510,.08)}else{clearInterval(interval);overlay.classList.add('hidden');state='play';playMusic();message.textContent='ヤリを避けて飛翔する敵の隙を狙え';prev=performance.now()}} ,1000)}
function doAttack(){if(state!=='play'||p.hurtTime>0||throwCooldown>0||spears.length>=2)return;spears.push({x:p.x+(p.face===1?17:-14),y:p.y+(keys.down?19:12),vx:p.face*220,life:1.9});throwCooldown=.3;sound(380,.07)}function doJump(){if(state!=='play'||p.hurtTime>0||p.jump)return;p.vy=-233;p.jump=true;p.locked=(keys.right?1:0)-(keys.left?1:0);p.vx=p.locked*97;sound(480,.08)}function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){frame++;clock+=dt;p.hurtTime=Math.max(0,p.hurtTime-dt);throwCooldown=Math.max(0,throwCooldown-dt);inv=Math.max(0,inv-dt);shake=Math.max(0,shake-dt*20);p.face=(e.x+e.w/2>=p.x+p.w/2)?1:-1;if(p.knockTime>0){p.knockTime-=dt;p.vx=p.knockX;p.knockX*=Math.max(0,1-dt*4);if(p.jump){p.vy+=520*dt;p.y+=p.vy*dt;if(p.y>=ground-p.h){p.y=ground-p.h;p.jump=false;p.vy=0}}}else if(!p.jump){let dx=(keys.right?1:0)-(keys.left?1:0);p.vx=keys.down?0:dx*94}else{p.vy+=520*dt;p.y+=p.vy*dt;if(p.y>=ground-p.h){p.y=ground-p.h;p.jump=false;p.vy=0}}p.x=cl(p.x+p.vx*dt,14,445);p.face=(e.x+e.w/2>=p.x+p.w/2)?1:-1;if(p.hurtTime<=0&&keys.attack&&throwCooldown<=0)doAttack();moveDemon(dt);for(let i=spears.length-1;i>=0;i--){let s=spears[i];s.x+=s.vx*dt;s.life-=dt;if(s.x<0||s.x>W||s.life<0){spears.splice(i,1);continue}if(rect({x:s.x-5,y:s.y-2,w:15,h:5},{x:e.x,y:e.y,w:e.w,h:e.h})){spears.splice(i,1);if(e.immune>0){particles(e.x+10,e.y+13,'#b9eaff',7);sound(480,.08);continue;}e.hp--;particles(e.x+10,e.y+13,'#ff8e46',16);sound(720,.13,'sawtooth',.04);shake=4;if(e.hp<=0){end(true);break}e.stun=.32;e.immune=.85;e.vx=s.vx>0?145:-145;e.mode='rest';message.textContent='赤き翼がひるんだ！ 攻撃のチャンス！'}else if(e.pattern==='aerial'&&e.timer>.25&&Math.abs(s.x-e.x)<75&&Math.abs(s.y-e.y-15)<30&&(!e.first)){e.targetY=cl(e.y-(42+Math.random()*18),28,100);e.targetX=cl(e.x+(s.vx>0?43:-43),40,430);e.timer=.65;e.first=true;particles(e.x+10,e.y+20,'#e6e2b6',4)}else if(e.mode==='perch')e.first=false}
for(let i=fireballs.length-1;i>=0;i--){let f=fireballs[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=65*dt;if(rect({x:f.x-3,y:f.y-3,w:8,h:8},{x:p.x+2,y:p.y+2,w:12,h:24})){hitPlayer('fire',f.x);fireballs.splice(i,1);continue}if(f.x<0||f.x>W||f.y>ground)fireballs.splice(i,1)}for(const a of sparks){a.x+=a.vx*dt;a.y+=a.vy*dt;a.time-=dt}sparks=sparks.filter(a=>a.time>0);if(rect({x:p.x+3,y:p.y+1,w:10,h:26},{x:e.x+3,y:e.y+2,w:15,h:27})&&e.stun<=0&&inv<=0){
 const dir=(p.x+p.w/2<e.x+e.w/2)?-1:1;

function draw(){c.save();if(shake>0)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background();for(const s of spears){c.save();if(s.vx<0){c.translate(s.x+15,0);c.scale(-1,1);bgImage(art.spear_new,0,s.y-5,23,10)}else bgImage(art.spear_new,s.x,s.y-5,23,10);c.restore()}for(const f of fireballs){pixel(f.x-3,f.y-3,9,9,'#a63d38');pixel(f.x,f.y,5,5,'#ffc04b');pixel(f.x+2,f.y+1,2,2,'#fff09c')}knight();demon();for(const s of sparks)pixel(s.x,s.y,3,3,s.col);c.restore()}
function loop(t){let dt=Math.min(.035,(t-prev)/1000||.016);prev=t;if(state==='play')update(dt);
if(state==='dying'){
