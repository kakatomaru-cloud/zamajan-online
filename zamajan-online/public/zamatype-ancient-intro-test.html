<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ザマタイプ 古文書オープニングテスト</title><style>*{box-sizing:border-box}body{margin:0;background:#10101b}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#intro{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(#392b32,#110d18);z-index:30;padding:14px;color:#624020;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}#paper{width:min(94vw,710px);max-height:95dvh;overflow:auto;text-align:center;padding:clamp(20px,4vw,44px);background:linear-gradient(90deg,#b58f5b,#f0dfb3 12%,#f4dfad 75%,#b58b56);border:12px ridge #9b713f;border-radius:9px;box-shadow:0 20px 100px #000b;animation:unroll .8s ease-out both}h1{font-size:clamp(27px,6vw,46px)}#rules{padding:17px 5px;border-block:1px solid #9b794c;text-align:left;font-size:clamp(14px,2.5vw,18px);line-height:2.1}button{border:1px solid #a37c49;border-radius:7px;background:#5c3c25;color:#f5e0b8;font:inherit;padding:10px 18px;cursor:pointer}#intro.out{opacity:0;pointer-events:none;transition:opacity .6s}#progress{height:3px;background:#875b2f;margin-top:18px;animation:drain 6s linear forwards;transform-origin:left}@keyframes drain{to{transform:scaleX(0)}}@keyframes unroll{from{transform:scaleY(.04);opacity:0}to{transform:scaleY(1);opacity:1}}@media(prefers-reduced-motion:reduce){#paper{animation:none}}</style></head><body><iframe title="元のザマタイプ" src="https://raw.githack.com/kakatomaru-cloud/zamajan-online/main/zamajan-online/public/zamatype-demo.html" allow="gamepad; fullscreen"></iframe><div id="intro" role="dialog" aria-modal="true"><div id="paper"><small>✦ 古より伝わりし戦いの書 ✦</small><h1>ザマタイプの書</h1><p>勇者よ、文字の力をもって魔物を討て。</p><div id="rules">壱、現れし文字を、鍵盤にて正しく打つべし。<br>弐、文字を完成させ、剣の一撃を放つべし。<br>参、四人の勇者は力を合わせ、魔物に立ち向かうべし。<br>肆、仲間とともに戦い、生き残るべし。</div><p>さあ、運命の戦いが幕を開ける……</p><button type="button" id="skip">古文書を閉じる</button><div id="progress"></div></div></div><script>(()=>{const x=document.getElementById("intro");let finished=false;const done=()=>{if(finished)return;finished=true;clearTimeout(t);document.removeEventListener("keydown",key,true);x.classList.add("out");setTimeout(()=>x.remove(),650)};const key=e=>{if(["Enter","Escape"," "].includes(e.key)){e.preventDefault();e.stopPropagation();done()}};document.addEventListener("keydown",key,true);document.getElementById("skip").onclick=done;const t=setTimeout(done,6000)})();</script></body></html>
