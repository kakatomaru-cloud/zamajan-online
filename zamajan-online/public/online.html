 (typeof hero==='string'&&(hero.startsWith('http://')||hero.startsWith('https://'))?`background-image:linear-gradient(180deg,rgba(7,7,8,.15),rgba(8,8,10,.92)),url('${hero.replace(/['"<>]/g,'')}')`:''));

async function optimizeImage(src){

function portableBackup(config){

  id:i+1,name:t.name,emoji:t.emoji||'🀄',image:t.image||null,
  count:t.count,imageOnly:!!t.imageOnly,wild:!!t.wild

  exportedAt:new Date().toISOString(),tiles,
  yaku:config.yaku.map(y=>({name:y.name,points:y.points,pattern:[...y.pattern]})),
  wildDeleted:!!config.wildDeleted};
}
function parsePortableBackup(raw){

 if(!Array.isArray(tiles)||tiles.length<1||tiles.length>100||!Array.isArray(yaku)||yaku.length>100)throw Error('牌・役の件数が不正です');
 if(tiles.some((t,i)=>!t||t.id!==i+1||typeof t.name!=='string'||t.name.length>80||
  (t.image!=null&&(typeof t.image!=='string'||!/^data:image\/(png|jpeg|webp);base64,/.test(t.image)||t.image.length>650000))||
  (t.count!=null&&(!Number.isInteger(+t.count)||+t.count<0||+t.count>40))))throw Error('牌の設定に不正なデータがあります');
 if(yaku.some(y=>!y||typeof y.name!=='string'||y.name.length>80||
  !Number.isInteger(y.points)||y.points<1||y.points>100000||
  !Array.isArray(y.pattern)||(y.pattern.length<1||y.pattern.length>99)||
  y.pattern.some(n=>!Number.isInteger(n)||n<1||n>tiles.length)))throw Error('役の設定に不正なデータがあります');
 const safeTiles=tiles.map((t,i)=>({
  id:i+1,name:t.name,emoji:typeof t.emoji==='string'?t.emoji:'🀄',
  image:t.image||null,count:t.count==null?9:+t.count,
  imageOnly:!!t.imageOnly,wild:!!t.wild
 }));
 if(!safeTiles.some(t=>t.wild)&&!raw.wildDeleted&&safeTiles[20]?.name==='特別牌')safeTiles[20].wild=true;
 if(safeTiles.filter(t=>t.wild).length>1)throw Error('特別牌が複数設定されています');
 return {tiles:safeTiles,yaku:yaku.map(y=>({name:y.name,points:y.points,pattern:[...y.pattern]})),wildDeleted:!!raw.wildDeleted};
}

 for(let i=0;i<result.tiles.length;i++){
  const t=result.tiles[i];if(!t.image)continue;

}

}function orderedOnlineDiscards(s){

// 役一覧は常に部屋主の共有設定を優先。タイトル画面では読み込んだ設定を表示。
function zscoreTile(id,cfg){
 const t=cfg.tiles[id-1];if(!t)return '';
 const inside=t.image?`<img src="${escape(t.image)}" alt="${escape(t.name)}">`:`<span class="zscore-emoji">${escape(t.emoji||'🀄')}</span><small>${escape(t.name)}</small>`;
 return `<span class="zscore-tile" title="${escape(t.name)}">${inside}</span>`;
}
async function openZscore(){
 const popup=window.open('','zamajan-score-sheet','width=1110,height=800,resizable=yes,scrollbars=yes');
 const cfg=state?.config||importedConfig||await loadSettings();
 if(popup && window.zjOpenScoreSheet?.(cfg,
   state?.config?'オンライン対戦中 · 部屋主の設定':'オンライン版 · 保存済み設定',
   new URL('title-art.jpg',location.href).href,popup))return;
 const box=$('zscoreList');
 $('zscoreContext').textContent=state?.config?'この対戦で使用中の役一覧（高得点順）':'現在の保存済み設定の役一覧（高得点順）';
 if(!cfg?.tiles?.length){box.innerHTML='<p>牌・役の設定がありません。タイトル画面で設定JSONを読み込んでください。</p>'}
 else if(!cfg.yaku?.length){box.innerHTML='<p>登録された役はありません。オフライン版で役を作成し、設定JSONを読み込んでください。</p>'}
 else{
  const roles=[...cfg.yaku].sort((a,b)=>Number(b.points)-Number(a.points));
  box.innerHTML=roles.map((y,i)=>`<div class="zscore-row"><div class="zscore-role">${i+1}. ${escape(y.name)}</div><div class="zscore-tiles">${(y.pattern||[]).map(id=>zscoreTile(id,cfg)).join('')}</div><div class="zscore-points">${Number(y.points||0).toLocaleString()}点</div></div>`).join('');
 }
 const enabled=(cfg?.tiles||[]).filter(t=>Number(t.count)>0);
 if(cfg && enabled.length){
  box.innerHTML += '<h3 style="margin-top:26px;color:#ffdc8f">牌ごとの役使用数（山0枚を除く）</h3>'+
   enabled.map(t=>`<div class="zscore-row">${zscoreTile(t.id,cfg)} ${escape(t.name)}：登録${(cfg.yaku||[]).reduce((n,y)=>n+(y.pattern||[]).filter(id=>id===t.id).length,0)}枚</div>`).join('');
 }
 $('zscoreMask').classList.remove('hidden');
}
function closeZscore(){$('zscoreMask').classList.add('hidden')}
$('zscoreTop').addEventListener('click',openZscore);
$('zscorePlay').addEventListener('click',openZscore);
$('zscoreClose').addEventListener('click',closeZscore);
$('zscoreMask').addEventListener('click',e=>{if(e.target===$('zscoreMask'))closeZscore()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZscore()});

// オフライン版と同じユーザー提供BGM。ブラウザの自動再生制限に対応。
const onlineBgm=new Audio('/zamajan-bgm.mp3');
onlineBgm.loop=true;onlineBgm.preload='auto';
const onlineBgmVolumeKey='zamajan-bgm-volume-v1';
function onlineSavedVolume(){try{const v=localStorage.getItem(onlineBgmVolumeKey);return v===null?3:Math.max(0,Math.min(100,Number(v)||0))}catch{return 3}}
const onlineBgmVolume=document.getElementById('onlineBgmVolume');
const onlineVolumeValue=document.getElementById('onlineBgmVolumeValue');
const onlineTitleBgmVolume=document.getElementById('titleBgmVolume');
const onlineTitleVolumeValue=document.getElementById('titleBgmVolumeValue');
function applyOnlineBgmVolume(value){
 const v=Math.max(0,Math.min(100,Number(value)||0));
 onlineBgm.volume=v/100;
 if(onlineBgmVolume)onlineBgmVolume.value=String(v);
 if(onlineVolumeValue)onlineVolumeValue.textContent=v+'%';
 if(onlineTitleBgmVolume)onlineTitleBgmVolume.value=String(v);
 if(onlineTitleVolumeValue)onlineTitleVolumeValue.textContent=v+'%';
 try{localStorage.setItem(onlineBgmVolumeKey,String(v))}catch{}
}
applyOnlineBgmVolume(onlineSavedVolume());
onlineBgmVolume?.addEventListener('input',e=>applyOnlineBgmVolume(e.target.value));
onlineTitleBgmVolume?.addEventListener('input',e=>applyOnlineBgmVolume(e.target.value));
let onlineBgmEnabled=true;
const bgmToggle=document.getElementById('bgmToggle');
function updateOnlineBgmButton(){bgmToggle.textContent=onlineBgm.paused?'♪ BGMを再生':'♫ BGMを停止'}
function playOnlineBgm(){if(!onlineBgmEnabled)return;const promise=onlineBgm.play();if(promise&&promise.catch)promise.catch(()=>{updateOnlineBgmButton()});updateOnlineBgmButton()}
bgmToggle.addEventListener('click',()=>{if(onlineBgm.paused){onlineBgmEnabled=true;playOnlineBgm()}else{onlineBgmEnabled=false;onlineBgm.pause();updateOnlineBgmButton()}});
onlineBgm.addEventListener('play',updateOnlineBgmButton);
onlineBgm.addEventListener('pause',updateOnlineBgmButton);
// 部屋作成・参加・対戦開始などのユーザー操作からBGMを開始する。
for(const id of ['create','join','start'])document.getElementById(id).addEventListener('click',playOnlineBgm);
// 自動再接続時はクリック操作なしに再生できないことがあるため、再生ボタンを表示。
</script></body></html>
