<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ザマじゃん ONLINE</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#f5e9cf;background:#0b0c0e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#30302b,#0b0c0e 80%);min-height:100vh}button,input,select{font:inherit}button{border:1px solid #cfa85b;background:linear-gradient(#66502a,#251a10);color:#fff0c5;padding:10px 16px;border-radius:8px;cursor:pointer}button:disabled{opacity:.4;cursor:default}input,select{background:#131a1a;color:white;border:1px solid #9b855e;padding:10px;border-radius:7px;max-width:100%}header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#080808;border-bottom:2px solid #b69252}h1{font-family:serif;color:#e6c078;margin:0}main{max-width:1200px;margin:auto;padding:16px}.panel{background:#101615ed;border:1px solid #ac8951;border-radius:12px;padding:18px;margin:15px auto}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.hidden{display:none!important}.muted{color:#c4b99f}.board{position:relative;min-height:690px;border:3px solid #b89353;border-radius:12px;background:radial-gradient(circle at center,transparent 0 18%,#33251766 19%,transparent 38%),repeating-linear-gradient(135deg,#0d1113,#17191a 4px,#0e1112 9px);box-shadow:inset 0 0 70px #000;padding:15px}.center-mark{position:absolute;top:33%;left:50%;transform:translate(-50%,-50%);font-size:140px;color:#9b70262c;pointer-events:none}.player{position:absolute;background:#070809e8;border:1px solid #d6b477;border-radius:8px;padding:9px;min-width:160px;text-align:center;z-index:1}.player.active{box-shadow:0 0 18px #e9b64b}.p0{bottom:138px;left:16px}.p1{top:16px;left:50%;transform:translateX(-50%)}.p2{top:35%;right:14px}.p3{top:35%;left:14px}.backs{font-size:18px;color:#bd8e43;letter-spacing:-2px}.discard-area{position:absolute;top:29%;left:19%;width:62%;height:38%;border:1px solid #977547;border-radius:8px;display:flex;flex-wrap:wrap;align-content:start;gap:4px;padding:12px;background:#07070770;overflow:auto}.tile{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(#fffefa,#ddd4be);color:#111;border:1px solid #b1a58e;border-bottom:5px solid #8b8275;border-radius:5px;min-width:43px;height:60px;padding:2px;box-shadow:1px 2px 3px #0009}.tile img{width:35px;height:38px;object-fit:contain}.tile small{font-size:9px}.tile .symbol{font-size:27px}.discard-area .tile{min-width:32px;height:41px;border-bottom-width:3px}.discard-area .tile img{width:24px;height:25px}.discard-area .tile .symbol{font-size:19px}.discard-area .tile small{font-size:7px}.myhand{position:absolute;bottom:17px;left:12%;right:3%;display:flex;flex-wrap:wrap;gap:4px;align-items:end}.myhand button{cursor:pointer}.myhand button:hover{transform:translateY(-9px)}.myhand .matching-drawn{border:5px solid #00f5ff!important;outline:3px solid white;outline-offset:2px;box-shadow:0 0 0 7px #006bff,0 0 20px 9px #00eaffaa!important}.myhand .just-drawn{margin-left:18px;position:relative}.myhand .just-drawn::before{content:'▼ ツモ';position:absolute;top:-29px;color:#00f5ff;font-weight:900;white-space:nowrap;text-shadow:0 0 6px black}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.status{font-weight:bold;color:#ffe4a6}.timer{border:1px solid #cfa85b;padding:9px 15px;border-radius:9px;color:#f6d58b;font-size:22px;font-weight:bold}.rank{display:flex;justify-content:space-between;padding:15px;border:1px solid #987744;margin:8px;border-radius:9px}.rank:first-child{background:#463516}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#000c;z-index:9}.modal{width:min(90vw,550px);text-align:center;background:linear-gradient(130deg,#141414,#302619,#0d0d0d);border:2px solid #e4bb67;border-radius:16px;padding:32px;box-shadow:0 0 60px #000}.modal h2{font-family:serif;color:#f5ce7a;font-size:60px;margin:10px}.copy{user-select:all;font-size:28px;color:#e4bd6c}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}@media(max-width:700px){.board{min-height:610px}.player{min-width:110px;font-size:12px}.p0{bottom:140px}.p2,.p3{top:24%}.discard-area{top:36%;left:5%;width:90%;height:29%}.myhand{left:4%;right:2%}.tile{min-width:32px;height:52px}.tile .symbol{font-size:22px}.tile img{width:29px}.tile small{font-size:8px}}
</style></head><body><header><h1>ザマじゃん <small>ONLINE</small></h1><a href="zamajan.html" style="color:#e5c78a">オフライン版</a></header><main><section class="panel" id="lobby"><h2>インターネット対戦</h2><p>友達と同じ6桁のルーム番号で参加できます。部屋を作る人の牌設定・役設定を使用します。</p><div class="row"><label>名前 <input id="nickname" maxlength="20" value="あなた"></label><label>対戦局数 <select id="rounds"><option>1</option><option>2</option><option selected>4</option><option>8</option><option>12</option><option>16</option><option>20</option></select></label></div><div class="row" style="margin-top:15px"><button id="create">部屋を作る</button><input id="roomCode" inputmode="numeric" maxlength="6" placeholder="6桁のルーム番号"><button id="join">部屋に参加</button></div><p class="muted">サーバーに公開後、友達にこのページのURLとルーム番号を伝えてください。</p></section><section id="room" class="panel hidden"><div class="row"><h2>ルーム <span id="code" class="copy"></span></h2><button id="copy">番号をコピー</button></div><div id="members"></div><p id="roomHelp" class="muted"></p><button id="start" class="hidden">対戦開始（空席はCPU）</button></section><section id="play" class="hidden"><div class="bar"><div class="status" id="message"></div><div class="timer" id="timer"></div></div><div class="board"><div class="center-mark">龍</div><div id="players"></div><div id="discards" class="discard-area"></div><div id="hand" class="myhand"></div></div><div class="panel"><span id="guide"></span><div id="logs" class="muted"></div></div></section></main><div id="overlay" class="overlay hidden"><div class="modal"><div id="outcome"></div><div class="actions"><button id="next" class="hidden">次の局へ</button><button id="home">タイトルに戻る</button></div></div></div><script src="/socket.io/socket.io.js"></script><script>
'use strict';const $=id=>document.getElementById(id),socket=io(),key='zamajan-online-reconnect',localKey='zamajan-set-v01';let state=null,session=null,seenRound=0,seenResult='',clock=null;const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tile(id,button=false,index=0){const t=state.config.tiles[id-1];const inner=t.image?`<img src="${t.image}" alt="${escape(t.name)}">`:`<span class="symbol">${t.emoji}</span>`;return button?`<button class="tile" data-idx="${index}">${inner}${t.imageOnly?'':`<small>${escape(t.name)}</small>`}</button>`:`<span class="tile">${inner}${t.imageOnly?'':`<small>${escape(t.name)}</small>`}</span>`}
function voice(word,male=false){try{const u=new SpeechSynthesisUtterance(word);u.lang='ja-JP';u.rate=male?.72:.92;u.pitch=male?.6:1.35;const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ja'));const preferred=vs.find(v=>male?/male|ichiro|otoya|takumi/i.test(v.name):/female|nanami|haruka|kyoko/i.test(v.name));if(preferred)u.voice=preferred;speechSynthesis.speak(u)}catch{}}
function draw(){socket.emit('draw')}function discard(i){socket.emit('discard',i)}function show(s){state=s;$('lobby').classList.add('hidden');$('room').classList.toggle('hidden',s.phase!=='lobby');$('play').classList.toggle('hidden',s.phase==='lobby');$('code').textContent=s.code;$('members').innerHTML=s.players.map((p,i)=>`<p>${i+1}番：${p?escape(p.name)+(p.cpu?'（CPU）':p.connected?'（接続中）':'（切断）'):'空席'}</p>`).join('');$('roomHelp').textContent=s.host?'参加者がそろったら対戦開始を押してください。空席はCPUになります。':'部屋主の開始を待っています。';$('start').classList.toggle('hidden',!s.host||s.phase!=='lobby');if(s.phase==='lobby')return;const current=s.players[s.turn];$('message').textContent=`第${s.round}局 ／ 山の残り ${s.wallCount}枚 ／ ${current?.name||''}の番`;$('players').innerHTML=s.players.map((p,i)=>`<div class="player p${(i-s.seat+4)%4} ${i===s.turn&&s.phase==='playing'?'active':''}"><b>${escape(p.name)}</b>　${s.scores[i].toLocaleString()}点<br>${s.riichi[i]?'<span style="color:#ffcf75">リーチ ━●━</span><br>':''}${i===s.seat?'あなた':`<span class="backs">${'▣'.repeat(Math.min(s.handCounts[i],10))}</span>`}${i===s.turn&&s.phase==='playing'&&i!==s.seat?'<br>💭 思考中…':''}</div>`).join('');$('discards').innerHTML=s.discards.map((a,i)=>a.map(id=>tile(id)).join('')).join('');const drawnId=s.drawn&&s.turn===s.seat?s.hand[s.hand.length-1]:null;$('hand').innerHTML=s.hand.map((id,i)=>tile(id,true,i)).join('');if(drawnId!==null){$('hand').querySelectorAll('button').forEach((b,i)=>{if(s.hand[i]===drawnId)b.classList.add('matching-drawn');if(i===s.hand.length-1)b.classList.add('just-drawn')})}$('hand').querySelectorAll('button').forEach(b=>{b.disabled=s.phase!=='playing'||s.turn!==s.seat;b.onclick=()=>s.drawn?discard(+b.dataset.idx):draw()});$('guide').textContent=s.phase==='playing'?(s.turn===s.seat?(s.drawn?'牌をクリックして捨ててください（15秒）':'手牌をクリックしてツモ（5秒で自動ツモ）'):'相手の手番です'):'局の終了';$('logs').innerHTML=s.logs.slice(-4).map(x=>`<div>${escape(x)}</div>`).join('');if(s.phase==='playing'&&s.round!==seenRound){seenRound=s.round;voice('はじめ！',true)}if(s.phase==='result'||s.phase==='final'){const resultKey=s.round+'-'+s.phase;if(seenResult!==resultKey){seenResult=resultKey;if(s.phase==='result')voice(s.result.method==='流局'?'りゅうきょく':s.result.method,s.result.method==='流局')}const ranks=s.scores.map((score,i)=>({i,score,name:s.players[i].name})).sort((a,b)=>b.score-a.score);$('outcome').innerHTML=s.phase==='final'?`<h2>最終順位</h2>${ranks.map((p,i)=>`<div class="rank"><b>${['🥇','🥈','🥉','4位'][i]} ${escape(p.name)}</b><b>${p.score.toLocaleString()}点</b></div>`).join('')}`:`<h2>${escape(s.result.method)}</h2><p>${s.result.winnerName?escape(s.result.winnerName)+' ／ '+escape(s.result.yaku)+' ／ '+s.result.points.toLocaleString()+'点':'山の牌がなくなりました'}</p>${s.result.hand?`<div class="row" style="justify-content:center">${s.result.hand.sort((a,b)=>a-b).map(id=>tile(id)).join('')}</div>`:''}`;$('overlay').classList.remove('hidden');$('next').classList.toggle('hidden',!s.host||s.phase==='final');$('next').textContent=s.round>=s.maxRounds?'最終ランキングを見る':'次の局へ'}else $('overlay').classList.add('hidden')}
function tick(){if(!state||state.phase!=='playing'){$('timer').textContent='';return}const remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));$('timer').textContent=(state.drawn?'捨て牌まで':'ツモまで')+` 残り ${remaining}秒`}
setInterval(tick,200);$('create').onclick=()=>{let cfg=null;try{cfg=JSON.parse(localStorage.getItem(localKey))}catch{}socket.emit('create',{name:$('nickname').value,maxRounds:+$('rounds').value,config:cfg})};$('join').onclick=()=>socket.emit('join',{code:$('roomCode').value,name:$('nickname').value});$('start').onclick=()=>socket.emit('start');$('next').onclick=()=>socket.emit('next');$('copy').onclick=()=>navigator.clipboard?.writeText(state.code);$('home').onclick=()=>location.href='online.html';socket.on('joined',x=>{session=x;localStorage.setItem(key,JSON.stringify(x))});socket.on('state',show);socket.on('errorMessage',m=>alert(m));socket.on('connect',()=>{try{const s=JSON.parse(localStorage.getItem(key));if(s?.code&&s?.token)socket.emit('join',{code:s.code,token:s.token,name:$('nickname').value})}catch{}});
</script></body></html>
