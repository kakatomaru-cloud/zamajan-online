</head><body><header><h1>ザマじゃん <small>ONLINE</small></h1><div class="row"><button id="globalExit" type="button" class="hidden" style="border:3px solid #ffe099;background:#9c2720;color:white;font-weight:900;box-shadow:0 0 16px #ffae4488">🚪 部屋から退出・タイトルへ</button><a href="zamajan.html" style="color:#e5c78a">オフライン版</a></div><button id="bgmToggle" type="button" style="position:fixed;right:14px;bottom:14px;z-index:10000;background:#16120b;color:#f6d18c;border:2px solid #bd9153;border-radius:9px;padding:12px 17px;cursor:pointer;font-weight:bold;box-shadow:0 3px 14px #000b" aria-label="BGMの再生・停止">♪ BGMを再生</button></header><main><section class="panel" id="lobby"><h2>インターネット対戦</h2><p>友達と同じ6桁のルーム番号で参加できます。部屋を作る人の牌設定・役設定を使用します。</p><div class="row"><label>名前 <input id="nickname" maxlength="20" value="あなた"></label><label>対戦局数 <select id="rounds"><option>1</option><option>2</option><option selected>4</option><option>8</option><option>12</option><option>16</option><option>20</option></select></label></div><div class="row" style="margin-top:15px"><button id="create">部屋を作る</button><input id="roomCode" inputmode="numeric" maxlength="6" placeholder="6桁のルーム番号"><button id="join">部屋に参加</button></div><div class="panel" style="margin:16px 0 0;max-width:850px;background:#090807d9"><b>以前のザマじゃんの牌画像・役設定を反映</b><p class="muted">オフライン版の「設定を書き出す」で保存したJSONファイルを選ぶと、部屋主の牌画像・名前・役をオンライン対戦に適用できます。</p><div class="row" style="margin:10px 0"><button type="button" id="configExport">現在の牌・役設定をバックアップ（JSON保存）</button><button type="button" id="configClear">保存設定を初期化</button></div><label>設定JSONを読み込む <input id="configImport" type="file" accept=".json,application/json"></label><div id="imageNotice">未読み込み：標準の絵文字牌を使用します</div></div><p class="muted">サーバーに公開後、友達にこのページのURLとルーム番号を伝えてください。</p></section><section id="room" class="panel hidden"><div class="row"><h2>ルーム <span id="code" class="copy"></span></h2><button id="copy">番号をコピー</button><button class="leave-room">部屋から退出してタイトルに戻る</button></div><div id="members"></div><p id="roomHelp" class="muted"></p><button id="start" class="hidden">対戦開始（空席はCPU）</button></section><section id="play" class="hidden"><div class="bar"><div class="status" id="message"></div><div class="timer" id="timer"></div><button class="leave-room">部屋から退出してタイトルに戻る</button></div><div class="board"><div class="center-mark">龍</div><div id="players"></div><div id="discards" class="discard-area"></div><div id="hand" class="myhand"></div></div><div class="panel"><span id="guide"></span><div id="logs" class="muted"></div></div></section></main><div id="overlay" class="overlay hidden"><div class="modal"><div id="outcome"></div><div class="actions"><button id="next" class="hidden">次の局へ</button><button id="home">部屋から退出してタイトルに戻る</button></div></div></div><script src="/socket.io/socket.io.js"></script><script>
'use strict';const $=id=>document.getElementById(id),socket=io(),key='zamajan-online-reconnect',localKey='zamajan-set-v01';let state=null,session=null,seenRound=0,seenResult='',clock=null,importedConfig=null;const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tile(id,button=false,index=0){const t=state.config.tiles[id-1]||{name:"不明な牌",emoji:"🀄"};const inner=t.image?`<img src="${escape(t.image)}" alt="${escape(t.name)}">`:`<span class="symbol">${t.emoji}</span>`;return button?`<button class="tile" data-idx="${index}">${inner}${t.imageOnly?'':`<small>${escape(t.name)}</small>`}</button>`:`<span class="tile">${inner}${t.imageOnly?'':`<small>${escape(t.name)}</small>`}</span>`}
function voice(word,male=false){try{const u=new SpeechSynthesisUtterance(word);u.lang='ja-JP';u.rate=male?.72:.92;u.pitch=male?.6:1.35;const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ja'));const preferred=vs.find(v=>male?/male|ichiro|otoya|takumi/i.test(v.name):/female|nanami|haruka|kyoko/i.test(v.name));if(preferred)u.voice=preferred;speechSynthesis.speak(u)}catch{}}
// 画像を含む牌設定は IndexedDB に保存。対戦情報とは別管理する。
const dbReady=new Promise(resolve=>{try{const req=indexedDB.open('zamajan-online-settings',1);req.onupgradeneeded=()=>req.result.createObjectStore('settings');req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)}catch{resolve(null)}});
async function saveSettings(cfg){const db=await dbReady;if(db){try{await new Promise((resolve,reject)=>{const tx=db.transaction('settings','readwrite');tx.objectStore('settings').put(cfg,'config');tx.oncomplete=resolve;tx.onerror=reject});return true}catch{}}try{localStorage.setItem(localKey,JSON.stringify(cfg));return true}catch{return false}}
async function loadSettings(){const db=await dbReady;if(db){try{const value=await new Promise(resolve=>{const req=db.transaction('settings').objectStore('settings').get('config');req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)});if(value)return value}catch{}}try{return JSON.parse(localStorage.getItem(localKey))}catch{return null}}
// 参加端末へは部屋主の画像データをサーバー経由で配信する。巨大画像は送信前に縮小する。
async function optimizeImage(src){
 if(typeof src!=='string'||!src.startsWith('data:image/'))return src;
 if(src.length<260000)return src;
 return await new Promise((resolve,reject)=>{
  const im=new Image();im.onload=()=>{
   try{const max=480,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.naturalWidth*scale));canvas.height=Math.max(1,Math.round(im.naturalHeight*scale));
    canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);
    let result=canvas.toDataURL('image/webp',.78);
    if(!result.startsWith('data:image/webp'))result=canvas.toDataURL('image/jpeg',.75);
    if(result.length>600000)throw Error('画像の圧縮後サイズが大きすぎます');resolve(result);
   }catch(e){reject(e)}
  };im.onerror=()=>reject(Error('画像を読み込めません'));im.src=src;
 });
}

function portableBackup(config){
 const tiles=config.tiles.map((t,i)=>({
  id:i+1,name:t.name,emoji:t.emoji||'🀄',image:t.image||null,
  count:t.count,imageOnly:!!t.imageOnly,wild:!!t.wild
 }));
 // Explicitly mark the legacy special tile, even in older saved settings.
 if(!tiles.some(t=>t.wild)&&!config.wildDeleted&&tiles[20]&&tiles[20].name==='特別牌')tiles[20].wild=true;
 return {format:'zamajan-config',schemaVersion:1,app:'zamajan',
  exportedAt:new Date().toISOString(),tiles,
  yaku:config.yaku.map(y=>({name:y.name,points:y.points,pattern:[...y.pattern]})),
  wildDeleted:!!config.wildDeleted};
}
function parsePortableBackup(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('設定データではありません');
 if(raw.format&&raw.format!=='zamajan-config')throw Error('対応していないバックアップ形式です');
 if(raw.schemaVersion&&raw.schemaVersion>1)throw Error('新しい形式のバックアップです。対応版へ更新してください');
 const tiles=raw.tiles,yaku=raw.yaku;
 if(!Array.isArray(tiles)||tiles.length<1||tiles.length>100||!Array.isArray(yaku)||yaku.length>100)throw Error('牌・役の件数が不正です');
 if(tiles.some((t,i)=>!t||t.id!==i+1||typeof t.name!=='string'||t.name.length>80||
  (t.image!=null&&(typeof t.image!=='string'||!/^data:image\/(png|jpeg|webp);base64,/.test(t.image)||t.image.length>650000))||
  (t.count!=null&&(!Number.isInteger(+t.count)||+t.count<0||+t.count>40))))throw Error('牌の設定に不正なデータがあります');
 if(yaku.some(y=>!y||typeof y.name!=='string'||y.name.length>80||
  !Number.isInteger(y.points)||y.points<1||y.points>100000||
  !Array.isArray(y.pattern)||(y.pattern.length<1||y.pattern.length>9)||
  y.pattern.some(n=>!Number.isInteger(n)||n<1||n>tiles.length)))throw Error('役の設定に不正なデータがあります');
 const safeTiles=tiles.map((t,i)=>({
  id:i+1,name:t.name,emoji:typeof t.emoji==='string'?t.emoji:'🀄',
  image:t.image||null,count:t.count==null?9:+t.count,
  imageOnly:!!t.imageOnly,wild:!!t.wild
 }));
 if(!safeTiles.some(t=>t.wild)&&!raw.wildDeleted&&safeTiles[20]?.name==='特別牌')safeTiles[20].wild=true;
 if(safeTiles.filter(t=>t.wild).length>1)throw Error('特別牌が複数設定されています');
 return {tiles:safeTiles,yaku:yaku.map(y=>({name:y.name,points:y.points,pattern:[...y.pattern]})),wildDeleted:!!raw.wildDeleted};
}

async function prepareConfig(cfg){
 if(!cfg)return null;
 if(!Array.isArray(cfg.tiles)||(cfg.tiles.length<1||cfg.tiles.length>100))throw Error('牌設定は1〜100種類で設定してください');
 const result={...cfg,tiles:cfg.tiles.map(t=>({...t}))};
 for(let i=0;i<result.tiles.length;i++){
  const t=result.tiles[i];if(!t.image)continue;
  if(!/^data:image\/(png|jpeg|webp);base64,/.test(t.image))throw Error(`${i+1}番の牌画像は埋め込み画像ではありません。オフライン版から設定JSONを出力してください`);
  t.image=await optimizeImage(t.image);
 }
 return result;
}
function configSummary(cfg,prefix='保存済み'){const images=cfg.tiles.filter(t=>t.image).length;$('imageNotice').textContent=`${prefix}：${images}種類の牌画像・${cfg.yaku.length}種類の役（このブラウザに保存）`}
loadSettings().then(cfg=>{if(cfg?.tiles?.length>=1&&cfg?.tiles?.length<=100){importedConfig=cfg;configSummary(cfg)}});
$('configExport').onclick=async()=>{const cfg=importedConfig||await loadSettings();if(!cfg){alert('保存された牌設定がありません。まずJSONを読み込んでください。');return}const blob=new Blob([JSON.stringify(portableBackup(cfg),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='zamajan-config-v1.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('configClear').onclick=async()=>{if(!confirm('このブラウザに保存された牌画像・役設定を初期化しますか？（対戦履歴は対象外）'))return;const db=await dbReady;if(db){const tx=db.transaction('settings','readwrite');tx.objectStore('settings').delete('config')}localStorage.removeItem(localKey);importedConfig=null;$('imageNotice').textContent='未読み込み：標準の絵文字牌を使用します'};
$('configImport').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const cfg=parsePortableBackup(JSON.parse(await f.text()));const prepared=await prepareConfig(cfg);importedConfig=prepared;const saved=await saveSettings(prepared);configSummary(prepared,saved?'読み込み・保存完了':'読み込み完了（保存できませんでした。JSONを保管してください）'); }catch(err){importedConfig=null;$('imageNotice').textContent='読み込み失敗：'+err.message}});
function resultTiles(result){
 if(!result.groups)return `<div class="row" style="justify-content:center">${result.hand.slice().sort((a,b)=>a-b).map(id=>tile(id)).join('')}</div>`;
 return `<div class="win-groups">${result.groups.map(group=>`<div class="win-group">${group.map(item=>`<div class="win-tile">${tile(item.id)}${item.id!==item.as?`<span class="wild-label">万能 → ${escape(state.config.tiles[item.as-1]?.name||'代用牌')}</span>`:''}</div>`).join('')}</div>`).join('')}</div>`;
}
function draw(){socket.emit('draw')}function discard(i){socket.emit('discard',i)}function show(s){if(!session)return;state=s;if(s.config?.tiles){const count=s.config.tiles.filter(t=>t.image).length;const note=$('roomHelp');if(note)note.dataset.imageCount=String(count)}$('globalExit').classList.remove('hidden');$('lobby').classList.add('hidden');$('room').classList.toggle('hidden',s.phase!=='lobby');$('play').classList.toggle('hidden',s.phase==='lobby');$('code').textContent=s.code;$('members').innerHTML=s.players.map((p,i)=>`<p>${i+1}番：${p?escape(p.name)+(p.cpu?'（CPU）':p.connected?'（接続中）':'（切断）'):'空席'}</p>`).join('');$('roomHelp').textContent=(s.host?'参加者がそろったら対戦開始を押してください。空席はCPUになります。':'部屋主の開始を待っています。')+` 共有中の牌画像：${s.config.tiles.filter(t=>t.image).length}種類（全端末共通）`; $('start').classList.toggle('hidden',!s.host||s.phase!=='lobby');if(s.phase==='lobby')return;const current=s.players[s.turn];$('message').textContent=`第${s.round}局 ／ 山の残り ${s.wallCount}枚 ／ ${current?.name||''}の番`;$('players').innerHTML=s.players.map((p,i)=>`<div class="player p${(i-s.seat+4)%4} ${i===s.turn&&s.phase==='playing'?'active':''}"><b>${escape(p.name)}</b>　${s.scores[i].toLocaleString()}点<br>${s.riichi[i]?'<span style="color:#ffcf75">リーチ ━●━</span><br>':''}${i===s.seat?'あなた':`<div class="opponent-tiles">${Array.from({length:s.handCounts[i]},()=>'<span class="tile-back"></span>').join('')}</div>`}${i===s.turn&&s.phase==='playing'&&i!==s.seat?'<br>💭 思考中…':''}</div>`).join('');$('discards').innerHTML=s.discards.map((a,i)=>a.map(id=>tile(id)).join('')).join('');const drawnId=s.drawn&&s.turn===s.seat?s.hand[s.hand.length-1]:null;$('hand').innerHTML=s.hand.map((id,i)=>tile(id,true,i)).join('');if(drawnId!==null){$('hand').querySelectorAll('button').forEach((b,i)=>{if(s.hand[i]===drawnId)b.classList.add('matching-drawn');if(i===s.hand.length-1)b.classList.add('just-drawn')})}$('hand').querySelectorAll('button').forEach(b=>{b.disabled=s.phase!=='playing'||s.turn!==s.seat;b.onclick=()=>s.drawn?discard(+b.dataset.idx):draw()});$('guide').textContent=s.phase==='playing'?(s.turn===s.seat?(s.drawn?'牌をクリックして捨ててください（15秒）':'手牌をクリックしてツモ（5秒で自動ツモ）'):'相手の手番です'):'局の終了';$('logs').innerHTML=s.logs.slice(-4).map(x=>`<div>${escape(x)}</div>`).join('');if(s.phase==='playing'&&s.round!==seenRound){seenRound=s.round;voice('はじめ！',true)}if(s.phase==='result'||s.phase==='final'){const resultKey=s.round+'-'+s.phase;if(seenResult!==resultKey){seenResult=resultKey;if(s.phase==='result')voice(s.result.method==='流局'?'りゅうきょく':s.result.method,s.result.method==='流局')}const ranks=s.scores.map((score,i)=>({i,score,name:s.players[i].name})).sort((a,b)=>b.score-a.score);$('outcome').innerHTML=s.phase==='final'?`<h2>最終順位</h2>${ranks.map((p,i)=>`<div class="rank"><b>${['🥇','🥈','🥉','4位'][i]} ${escape(p.name)}</b><b>${p.score.toLocaleString()}点</b></div>`).join('')}`:`<h2>${escape(s.result.method)}</h2><p>${s.result.winnerName?escape(s.result.winnerName)+' ／ '+escape(s.result.yaku)+' ／ '+s.result.points.toLocaleString()+'点':'山の牌がなくなりました'}</p>${s.result.hand?resultTiles(s.result):''}`;$('overlay').classList.remove('hidden');$('next').classList.toggle('hidden',!s.host||s.phase==='final');$('next').textContent=s.round>=s.maxRounds?'最終ランキングを見る':'次の局へ'}else $('overlay').classList.add('hidden')}
function tick(){if(!state||state.phase!=='playing'){$('timer').textContent='';return}const remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));$('timer').textContent=(state.drawn?'捨て牌まで':'ツモまで')+` 残り ${remaining}秒`}
setInterval(tick,200);$('create').onclick=async()=>{try{const cfg=await prepareConfig(importedConfig||await loadSettings());if(cfg){importedConfig=cfg;await saveSettings(cfg)}socket.emit('create',{name:$('nickname').value,maxRounds:+$('rounds').value,config:cfg})}catch(e){alert('牌画像の送信準備に失敗しました：'+e.message)}};$('join').onclick=()=>socket.emit('join',{code:$('roomCode').value,name:$('nickname').value});$('start').onclick=()=>socket.emit('start');$('next').onclick=()=>socket.emit('next');$('copy').onclick=()=>navigator.clipboard?.writeText(state.code);function leaveRoom(){if(!confirm('この部屋から退出してタイトルに戻りますか？\n対戦中は手牌・点数をそのままCPUが引き継ぎます。待機中に部屋主が退出すると部屋が終了します。'))return;localStorage.removeItem(key);socket.emit('leave');resetToLobby()}function resetToLobby(){$('globalExit').classList.add('hidden');state=null;session=null;seenRound=0;seenResult='';$('overlay').classList.add('hidden');$('room').classList.add('hidden');$('play').classList.add('hidden');$('lobby').classList.remove('hidden');$('timer').textContent=''}document.querySelectorAll('.leave-room').forEach(b=>b.onclick=leaveRoom);$('globalExit').onclick=leaveRoom;$('home').onclick=leaveRoom;socket.on('joined',x=>{session=x;localStorage.setItem(key,JSON.stringify(x))});socket.on('state',show);socket.on('roomClosed',message=>{localStorage.removeItem(key);resetToLobby();alert(message||'部屋が終了しました')});socket.on('errorMessage',m=>{if(m==='ルームが見つかりません'){localStorage.removeItem(key);resetToLobby()}alert(m)});socket.on('connect',()=>{try{const s=JSON.parse(localStorage.getItem(key));if(s?.code&&s?.token)socket.emit('join',{code:s.code,token:s.token,name:$('nickname').value})}catch{}});

// オフライン版と同じユーザー提供BGM。ブラウザの自動再生制限に対応。
const onlineBgm=new Audio('/zamajan-bgm.mp3');
onlineBgm.loop=true;onlineBgm.volume=0.34;onlineBgm.preload='auto';
let onlineBgmEnabled=true;
const bgmToggle=document.getElementById('bgmToggle');
function updateOnlineBgmButton(){bgmToggle.textContent=onlineBgm.paused?'♪ BGMを再生':'♫ BGMを停止'}
function playOnlineBgm(){if(!onlineBgmEnabled)return;const promise=onlineBgm.play();if(promise&&promise.catch)promise.catch(()=>{updateOnlineBgmButton()});updateOnlineBgmButton()}
bgmToggle.addEventListener('click',()=>{if(onlineBgm.paused){onlineBgmEnabled=true;playOnlineBgm()}else{onlineBgmEnabled=false;onlineBgm.pause();updateOnlineBgmButton()}});
onlineBgm.addEventListener('play',updateOnlineBgmButton);
onlineBgm.addEventListener('pause',updateOnlineBgmButton);
// 部屋作成・参加・対戦開始などのユーザー操作からBGMを開始する。
for(const id of ['create','join','start'])document.getElementById(id).addEventListener('click',playOnlineBgm);
// 自動再接続時はクリック操作なしに再生できないことがあるため、再生ボタンを表示。
</script></body></html>
